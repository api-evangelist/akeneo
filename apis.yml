- aid: akeneo:akeneo-mapping-schema-for-products-api
  name: Akeneo Mapping schema for products API
  description: >-
    The mapping schema for products defines the expected structure of product data when synchronizing
    via the API.

    It describes the fields, their types, constraints, and transformation rules applied during the export
    or import of products in a catalog connected to an App.

    This schema ensures data consistency between Akeneo PIM and third-party applications by clarifying
    how PIM attributes correspond to those expected by the App.

    For each field, the schema specifies the data type (text, number, boolean, etc.), whether the field
    is required or optional, and any allowed values or transformations to apply.
  humanURL: https://api.akeneo.com/api-reference-index.html
  baseURL: https://api.akeneo.com
