- aid: akeneo:akeneo-overview-api
  name: Akeneo Overview API
  description: >-
    This API reference provides comprehensive documentation for the Akeneo PIM REST API.

    It describes all available endpoints, request and response formats, authentication methods, and error
    codes.

    The Akeneo PIM REST API enables you to interact programmatically with your PIM instance, allowing
    you to manage products, product models, attributes, categories, assets, reference entities, and more.

    You can use the API to integrate Akeneo PIM with other systems, automate data flows, and build custom
    applications.

    All API endpoints are organized by resource type and support standard HTTP methods (GET, POST, PUT,
    PATCH, DELETE).

    Authentication is required for all endpoints and is based on OAuth 2.0 or HTTP Basic authentication.

    For more details, please refer to the [official Akeneo API documentation](https://api.akeneo.com/).
  humanURL: https://api.akeneo.com/api-reference-index.html
  baseURL: https://api.akeneo.com
