- aid: akeneo:akeneo-measurement-family-api
  name: Akeneo Measurement family API
  description: >-
    A measurement family is a set of comparable units used to measure a specific physical quantity, such
    as Area, Weight, or Power.

    For example, the "Weight" measurement family can group units like "Kilogram" and "Pound" together.

    Each family has a standard unit for conversions (e.g., "Kilogram"), and all other units within that
    family include their conversion formulas.

    These families are used for metric attributes, allowing product data to be entered in one unit and
    automatically converted for different channels or locales.
  humanURL: https://api.akeneo.com/api-reference-index.html
  baseURL: https://api.akeneo.com
