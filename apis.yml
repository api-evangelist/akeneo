- aid: akeneo:akeneo-catalog-products-api
  name: Akeneo Catalog products API
  description: >-
    A catalog contains a selection of products from the PIM, intended to be synchronized with a third-party
    application via the API.

    The Catalog products endpoint allows you to retrieve the list of products for a given catalog, with
    options to filter, paginate, and select the returned fields.

    Each returned product includes its attributes, values, status information, and associated references,
    all in the context of the catalog.

    This endpoint is mainly used by Apps to synchronize product data between Akeneo PIM and external platforms,
    while respecting access rights and catalog configuration.
  humanURL: https://api.akeneo.com/api-reference-index.html
