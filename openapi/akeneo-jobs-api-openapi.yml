        required: true
        schema:
          type: string
        example: my_entity_code
      requestBody:
        required: false
        description: Body to change the import mode for this job.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                import_mode:
                  type: string
                  enum:
                  - create_only
                  - update_only
                  - create_or_update
                  description: 'Change the import mode for this job by overriding the profile value.

                    Available values are: *create_only*, *update_only* and *create_or_update*.

                    '
                  example: create_or_update
