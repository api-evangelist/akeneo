  /api/rest/v1/workflows/tasks/{uuid}:
    patch:
      operationId: patch_workflow_tasks_by_uuid
      x-visibility: public
      summary: Update a Workflow Task's Status (Approve, Reject, Complete)
      description: 'Completes or approves/rejects a task.

        The request body''s structure depends on the action being performed.


        - To **approve** a ''review'' task, set status to `approved`.

        - To **complete** an ''enrichment'' task, set status to `completed`.

        - To **reject** a ''review'' task, set status to `rejected`, provide `send_back_to_step_uuid`, and optionally provide `rejected_attributes` to specify details about rejected attributes.'
      tags:
      - Workflow tasks
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: uuid
        description: 'This path parameter is used to specify the unique identifier of the entity you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the UUID is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        description: The action to perform on the task, determined by the payload
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - status
                - send_back_to_step_uuid
                description: Payload for rejecting a review task
                properties:
                  status:
                    type: string
                    description: Must be 'rejected' for this action
                    enum:
                    - rejected
                  send_back_to_step_uuid:
                    type: string
                    format: uuid
                    description: The UUID of the workflow step to which the task should be returned
                    example: 123e4567-e89b-12d3-a456-426614174000
                  rejected_attributes:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                        - comment
                        - locale
                        - scope
                        properties:
                          comment:
                            type: string
                            description: Comment about the rejection reason for this attribute.
                          locale:
                            type:
                            - string
                            - 'null'
                            description: Locale code, or null if not applicable.
                          scope:
                            type:
                            - string
                            - 'null'
                            description: Scope code, or null if not applicable.
                    description: 'Optionally provides details about which attributes were rejected.

                      For each attribute name you can specify a comment, the locale, and the scope for the rejection.

                      '
              - type: object
                required:
                - status
                description: Payload for completing an enrichment task
                properties:
                  status:
                    type: string
                    enum:
                    - completed
              - type: object
                required:
                - status
                description: Payload for approving a review task
                properties:
                  status:
                    type: string
                    enum:
                    - approved
            examples:
              rejectTask:
                summary: Example for Rejecting a Task
                value:
                  status: rejected
                  send_back_to_step_uuid: 123e4567-e89b-12d3-a456-426614174000
                  rejected_attributes:
                    name:
                    - comment: ''
                      locale: null
                      scope: null
                    description:
                    - comment: Wrong description
                      locale: en_US
                      scope: ecommerce
                    - comment: ''
                      locale: fr_FR
                      scope: mobile
              completeTask:
                summary: Example for Completing a Task
                value:
                  status: completed
              approveTask:
                summary: Example for Approving a Task
                value:
                  status: approved
      responses:
        '204':
          description: 'This response indicates that the request was successful and that there is no content to return.

            It is typically used in response to a successful update operation where the server does not need to return any data to the client.

            '
          headers:
            Location:
              description: URI of the updated resource
              schema:
                type: string
        '400':
          description: 'This response indicates that the server cannot process the request due to a client error, such as malformed request syntax, invalid request message framing, or deceptive request routing.

            It is typically used when the server cannot understand the request due to invalid JSON or other client-side issues.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 400
                message: Invalid JSON message received
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '415':
          description: 'This response indicates that the `Content-type` header of the request is not supported by the server.

            The server expects the `Content-type` header to be `application/json`, and any other value will result in this error.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 415
                message: xxx in `Content-type` header is not valid.  Only `application/json` is allowed."
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 422
                  message:
                    type: string
                    description: Description of the validation error
                    example: Cannot update task, provided status is not supported.
              examples:
                statusNotSupported:
                  summary: Provided status is not supported
                  value:
                    code: 422
                    message: Cannot update task, provided status is not supported.
                sendBackToStepNotProvided:
                  summary: send_back_to_step not provided
                  value:
                    code: 422
                    message: Cannot reject task, send_back_to_step_uuid is not provided.
                rejectedAttributeNotAssigned:
                  summary: A rejected attribute is not assigned to the task
                  value:
                    code: 422
                    message: Attribute "description" on channel "ecommerce" and locale "en_US" is not assigned to the task.
components:
  securitySchemes:
    basicToken:
      scheme: basic
      type: http
      description: 'HTTP Basic authentication using user credentials.

        [More information here](https://api.akeneo.com/documentation/authentication.html)

        '
    bearerToken:
      scheme: bearer
      type: http
      description: 'Bearer token obtained via the "Password Grant" flow.

        This token authenticates a user, is valid for one hour, and can be refreshed using a refresh token.

        [More information here](https://api.akeneo.com/documentation/authentication.html)

        '
    appToken:
      scheme: bearer
      type: http
      description: 'Bearer token for Apps, obtained via the OAuth 2.0 flow.

        This permanent token allows an application to make requests on behalf of a user.

        [More information here](https://api.akeneo.com/apps/authentication-and-authorization.html)

        '
