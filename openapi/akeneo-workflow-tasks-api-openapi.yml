openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Workflow tasks API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Workflow tasks
  description: 'The Tasks endpoints allow you to retrieve the tasks for each workflow steps, products and product models.

    It also allows you to manage the tasks by approving, rejecting or completing them.'
paths:
  /api/rest/v1/workflows/tasks:
    get:
      operationId: get_workflow_tasks
      x-visibility: public
      summary: Get list of workflow tasks
      description: Retrieves a paginated list of tasks for a specified workflow step
      tags:
      - Workflow tasks
      security:
      - bearerToken: []
      parameters:
      - name: search
        in: query
        description: 'Stringified JSON to filter tasks.

          For more details see the [Filters](https://api.akeneo.com/documentation/filter.html#filter-on-workflow-tasks) section.

          '
        required: true
        schema:
          type: string
        examples:
          getTasksByStepUuid:
            summary: Search by step UUID
            value: '{"step_uuid":[{"operator":"=","value":"0a2c9f49-2b4f-42a5-b7f9-6c50f6bce8e9"}]}'
          getTasksByProductUuid:
            summary: Search by product UUID
            value: '{"step_uuid":[{"operator":"=","value":"0a2c9f49-2b4f-42a5-b7f9-6c50f6bce8e9"}],"product_uuid":[{"operator":"IN","value":["123e4567-e89b-12d3-a456-426614174000"]}]}'
          getTasksByProductModelCode:
            summary: Search by product model code
            value: '{"step_uuid":[{"operator":"=","value":"0a2c9f49-2b4f-42a5-b7f9-6c50f6bce8e9"}],"product_model_code":[{"operator":"IN","value":["amor", "apollon]}]}'
      - name: with_attributes
        in: query
        description: Whether to include task attributes in the response
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100
        example: 100
      responses:
        '200':
          description: 'Paginated list of tasks for a specified workflow step.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Workflow Tasks
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 1
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            type: object
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          format: uri
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/workflows/tasks/8f6c2d18-fbd4-4f7e-81df-cb3dc368fe07
                                    edit:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          format: uri
                                          description: URL to access the task in Akeneo
                                          example: https://demo.akeneo.com/public/workflows/tasks/8f6c2d18-fbd4-4f7e-81df-cb3dc368fe07/edit
                            - type: object
                              properties:
                                uuid:
                                  type: string
                                  description: Task UUID
                                  format: uuid
                                  example: 8f6c2d18-fbd4-4f7e-81df-cb3dc368fe07
                                status:
                                  type: string
                                  description: Task status
                                  example: in_progress
                                created_at:
                                  type: string
                                  format: date-time
                                  description: Task creation date
                                  example: '2024-02-22T17:31:00Z'
                                product:
                                  type: object
                                  properties:
                                    uuid:
                                      type: string
                                      format: uuid
                                      description: Product UUID
                                      example: 7108ee60-a1ea-4fe1-baca-b39909e23d24
                                product_model:
                                  type: object
                                  properties:
                                    code:
                                      type: string
                                      description: Product model code
                                      example: a-product-model-code
                                due_date:
                                  type:
                                  - string
                                  - 'null'
                                  format: date-time
                                  description: Due date
                                  example: '2024-03-31T18:00:00Z'
                                rejected:
                                  type: boolean
                                  description: Whether the task is rejected
                                  example: true
                                pending_attributes:
                                  type: object
                                  description: 'Object of attributes for the task that are awaiting completion or require user input.

                                    Each key is an attribute code and each value is an array of objects with information on locale, scope, rejection status and comment.

                                    This field is only included when `with_attributes=true`.

                                    '
                                  additionalProperties:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - rejected
                                      properties:
                                        locale:
                                          type:
                                          - string
                                          - 'null'
                                          description: The locale code for the attribute value, null if the attribute is not localizable
                                          example: en_US
                                        scope:
                                          type:
                                          - string
                                          - 'null'
                                          description: The scope (channel) code for the attribute value, null if the attribute is not scopable
                                          example: ecommerce
                                        rejected:
                                          type: boolean
                                          description: Whether this attribute value has been rejected
                                          example: true
                                        comment:
                                          type: string
                                          description: Optional comment explaining why the attribute value was rejected.
                                          example: This attribute value needs improvement
                                  example:
                                    name:
                                    - locale: null
                                      scope: null
                                      rejected: true
                                      comment: This needs improvement
                                    description:
                                    - locale: en_US
                                      scope: ecommerce
                                      rejected: false
                                    - locale: fr_FR
                                      scope: ecommerce
                                      rejected: true
              examples:
                paginatedTasks:
                  summary: Example of a paginated list of workflow step tasks
                  value:
                    _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/workflows/tasks?search={"step_uuid":[{"operator":"=","value":"0a2c9f49-2b4f-42a5-b7f9-6c50f6bce8e9"}]}&page=1&limit=10
