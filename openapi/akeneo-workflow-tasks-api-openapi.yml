                paginatedTasksWithPendingAttributes:
                  summary: Example of a paginated list of workflow step tasks with pending attributes
                  value:
                    _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/workflows/tasks?search={"step_uuid":[{"operator":"=","value":"0a2c9f49-2b4f-42a5-b7f9-6c50f6bce8e9"}]}&with_attributes=true&page=1&limit=10
                      first:
