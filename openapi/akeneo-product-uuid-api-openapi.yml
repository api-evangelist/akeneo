  /api/rest/v1/products-uuid/{uuid}/associations:
    get:
      operationId: get_product_uuid_associations
      x-visibility: public
      summary: Get the associations of a product
      description: 'This endpoint allows you to get, page by page, the entities a product is associated to, whatever the kind of

        the association type: manual, quantified or automatic, every kind answers the same item. A manual or

        quantified association type lists the entities the product payload lists for it, those inherited from its

        parent models included and those you may not view left out. An automatic association type lists the entities

        its rule resolves to, when the rule applies to the product.


        An item names its association type in `association_type` and what it leads to: `type` is `product`,

        `product_model` or `group` (groups only on a manual association type), and `id` is a product uuid, a product

        model code or a group code. An item of a quantified association type also carries its `quantity`. Items are

        ordered by association type code, then every product, every product model and every group.


        The collection only pages with `search_after`, whatever its size: its `search_after` token is an opaque cursor,

        read it from the `next` link rather than building it. The `page` pagination, `page` and `with_count` answer

        a 422.


        Only available while product compatibility is enabled on the PIM: the endpoint answers a 404 otherwise.'
      tags:
      - Product [uuid]
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: uuid
        description: 'This path parameter is used to specify the unique identifier of the entity you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the UUID is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - in: query
        name: search
        description: 'Filter the associations by association type, with the `IN` or `NOT IN` operator, in the syntax of the

          [Filters](https://api.akeneo.com/documentation/filter.html) section. Codes are compared whatever their case, and

          a code no association type holds answers a 422.

          '
        required: false
        schema:
          type: string
        examples:
          getAssociationsOfSomeTypes:
            summary: Read the associations of two association types
            value: '{"association_type":[{"operator":"IN","value":["X_SELL","fits"]}]}'
          getAssociationsOfEveryOtherType:
            summary: Leave the associations of an association type out
            value: '{"association_type":[{"operator":"NOT IN","value":["X_SELL"]}]}'
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      responses:
        '200':
          description: Returns a page of the entities the product or product model is associated to, whatever the association type
          content:
            application/json:
              schema:
                title: Product Associations
                type: object
                properties:
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            description: URI of the current page of associations
                            example: https://demo.akeneo.com/api/rest/v1/products-uuid/8a8494a2-3f3d-4f0f-9d97-1a4a5d3c2f01/associations?pagination_type=search_after&limit=10
                      first:
                        type: object
                        properties:
                          href:
                            type: string
                            description: URI of the first page of associations
                            example: https://demo.akeneo.com/api/rest/v1/products-uuid/8a8494a2-3f3d-4f0f-9d97-1a4a5d3c2f01/associations?pagination_type=search_after&limit=10
                      next:
                        type: object
                        properties:
                          href:
                            type: string
                            description: URI of the next page of associations, only on a full page
                            example: https://demo.akeneo.com/api/rest/v1/products-uuid/8a8494a2-3f3d-4f0f-9d97-1a4a5d3c2f01/associations?pagination_type=search_after&limit=10&search_after=WyJYX1NFTEwiLCJncm91cDpzdW1tZXJfc2FsZSJd
                  _embedded:
                    type: object
                    properties:
                      items:
                        type: array
                        description: Ordered by association type code, then every product, every product model and every group
                        items:
                          title: Product Association
                          description: 'One entity the product or product model is associated to, and the association type leading to it, whatever its

                            kind: manual, quantified or automatic. An association reaches products, product models and groups, so an item

                            names what it is rather than carrying a bare identifier. A product also comes with its `identifier`, null when

                            it has none. Only an item of a quantified association type carries a `quantity`.

                            '
                          oneOf:
                          - title: Product Association To A Product
                            type: object
                            properties:
                              association_type:
                                type: string
                                description: The code of the association type
                              type:
                                type: string
                                enum:
                                - product
                              id:
                                type: string
                                format: uuid
                                description: The UUID of the product
                              identifier:
                                type:
                                - string
                                - 'null'
                                description: The identifier of the product, null when the product has none
                              quantity:
                                type: integer
                                description: How many of the product are associated, only on a quantified association type
                            required:
                            - association_type
                            - type
                            - id
                            - identifier
                            additionalProperties: false
                          - title: Product Association To A Product Model
                            type: object
                            properties:
                              association_type:
                                type: string
                                description: The code of the association type
                              type:
                                type: string
                                enum:
                                - product_model
                              id:
                                type: string
                                description: The code of the product model
                              quantity:
                                type: integer
                                description: How many of the product model are associated, only on a quantified association type
                            required:
                            - association_type
                            - type
                            - id
                            additionalProperties: false
                          - title: Product Association To A Group
                            type: object
                            properties:
                              association_type:
                                type: string
                                description: The code of the association type
                              type:
                                type: string
                                enum:
                                - group
                              id:
                                type: string
                                description: The code of the group, only on a manual association type
                            required:
                            - association_type
                            - type
                            - id
                            additionalProperties: false
                    example:
                      items:
                      - association_type: PACK
                        type: product
                        id: 0b1e3a52-7d0f-4f1e-8b7a-2f3c9d6e4a10
                        identifier: tripod_kit
                        quantity: 2
                      - association_type: X_SELL
                        type: product_model
                        id: tshirt_divided
                required:
                - _links
                - _embedded
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/products-uuid/8a8494a2-3f3d-4f0f-9d97-1a4a5d3c2f01/associations?pagination_type=search_after&limit=4
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/products-uuid/8a8494a2-3f3d-4f0f-9d97-1a4a5d3c2f01/associations?pagination_type=search_after&limit=4
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/products-uuid/8a8494a2-3f3d-4f0f-9d97-1a4a5d3c2f01/associations?pagination_type=search_after&limit=4&search_after=WyJmaXRzIiwicHJvZHVjdF85YzJkNGU2Zi0xYTNiLTRjNWQtOGU3Zi0wYTFiMmMzZDRlNWYiXQ
                _embedded:
                  items:
                  - association_type: PACK
                    type: product
                    id: 0b1e3a52-7d0f-4f1e-8b7a-2f3c9d6e4a10
                    identifier: tripod_kit
                    quantity: 2
                  - association_type: X_SELL
                    type: product
                    id: 6f6c0f4e-2c4b-4c43-9a0e-7c1c6a1f0b1a
                    identifier: hdmi_cable_2m
                  - association_type: X_SELL
                    type: product_model
                    id: tshirt_divided
                  - association_type: fits
                    type: product
                    id: 9c2d4e6f-1a3b-4c5d-8e7f-0a1b2c3d4e5f
                    identifier: tv_oled_55
        '400':
          description: 'This response indicates that the server cannot process the request due to a client error, such as malformed request syntax, invalid request message framing, or deceptive request routing.

            It is typically used when the server cannot understand the request due to invalid JSON or other client-side issues.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 400
                message: Invalid JSON message received
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '404':
          description: 'This response indicates that the requested resource could not be found on the server.

            It can occur when the resource code given in the URI does not correspond to any existing PIM resource.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 404
                message: Resource `my_resource_code` does not exist.
        '406':
          description: 'This response indicates that the server cannot produce a response matching the list of acceptable values defined in the request''s `Accept` header.

            It is typically used when the requested resource is not available in the requested format.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 406
                message: xxx in `Accept` header is not valid. Only `application/json` is allowed.
        '422':
          description: 'This response indicates that the validation of the entity given in the body of the request failed.

            It occurs when the server understands the request but cannot process it due to validation errors in the provided data.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 422
                  message:
                    type: string
                    description: Message explaining the error
                    example: Validation failed.
                  errors:
                    type: array
                    description: A list of validation error messages (optional)
                    items:
                      type: object
                      properties:
                        property:
                          type: string
                          description: Name of the invalid property
                        message:
                          type: string
                          description: Human-readable error message
                        attribute:
                          type:
                          - string
                          - 'null'
                          description: Attribute code (if the error is on an attribute)
                        locale:
                          type:
                          - string
                          - 'null'
                          description: Locale code involved in the error, if any
                        scope:
                          type:
                          - string
                          - 'null'
                          description: Channel code involved in the error, if any
                    example:
                    - property: family
                      message: The tshirts family does not exist in your PIM.
                  _links:
                    type: object
                    properties:
                      documentation:
                        type: object
                        properties:
                          href:
                            type: string
                    example:
                      documentation:
                        href: http://api.akeneo.com/api-reference.html
              example:
                code: 422
                message: Validation failed.
                errors:
                - property: family
                  message: The tshirts family does not exist in your PIM.
                - property: categories
                  message: The "tvs_projectors" category does not exist.
                - property: associations.SUBSTITUTION.groups
                  message: You should associate existing groups. The "promotion" group does not exist.
                - property: values
                  message: The "description" attribute requires a channel.
                  attribute: description
                  locale: en_US
                  scope: null
                - property: values
                  message: The "name" attribute requires a locale.
                  attribute: name
                  locale: null
                  scope: null
                _links:
                  documentation:
                    href: http://api.akeneo.com/api-reference.html
