  /api/rest/v1/products-uuid/search:
    post:
      operationId: post_products_uuid_search
      x-visibility: public
      summary: Search list of products
      description: 'This endpoint allows you to search for products that match the filters provided in the request body.

        Products are paginated and can be filtered by scope, locales, attributes, and other criteria.

        User-group-based permissions are applied to the products you request.


        Important limitations

        - The maximum number of attributes in the request body is 800.

        - The maximum number of search criteria is 20.

        - The maximum number of items in an array (e.g., values for filters like `IN` or `NOT IN`) is 800.'
      tags:
      - Product [uuid]
      security:
      - bearerToken: []
      parameters:
      - in: query
        name: pagination_type
        description: 'Specify which pagination method to use for navigating through large datasets.

          It is useful for choosing between different pagination strategies based on your specific use case and performance requirements.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          enum:
          - page
          - search_after
          default: page
        example: page
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      requestBody:
        description: Body of the request to search for products
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: 'Stringified JSON to filter products,

                    for more details see the [Filters](https://api.akeneo.com/documentation/filter.html) section.

                    '
                  example: '{"completeness":[{"operator": "=", "value": 100, "scope":"ecommerce"}]}'
                scope:
                  type: string
                  description: 'Filter product values to return scopable attributes for the given channel as well as the non localizable/non scopable attributes,

                    for more details see the [Filter product values via channel](https://api.akeneo.com/documentation/filter.html#via-channel) section.

                    '
                  example: ecommerce
                locales:
                  type: string
                  description: 'Filter product values to return localizable attributes for the given locales as well as the non localizable/non scopable attributes,

                    for more details see the [Filter product values via locale](https://api.akeneo.com/documentation/filter.html#via-locale) section.

                    '
                  example: en_US,fr_FR
                attributes:
                  type: string
                  description: 'Filter product values to only return those concerning the given attributes,

                    for more details see the [Filter product values via attributes](https://api.akeneo.com/documentation/filter.html#via-attributes) section.

                    '
                  example: name,description
                convert_measurements:
                  type: boolean
                  description: 'Convert measurement attribute values to the appropriate unit for the channel provided by the "scope" parameter.

                    '
                  default: false
                  example: true
                with_attribute_options:
                  type: boolean
                  description: 'Return labels of attribute options in the response.

                    See [the `linked_data` format](https://api.akeneo.com/concepts/products.html#the-linked_data-format) section for more details.

                    '
                  example: true
                with_asset_share_links:
                  type: boolean
                  description: 'Whether to return asset collection share link URLs in the response.

                    See [the `linked_data` format](https://api.akeneo.com/concepts/products.html#the-linked_data-format) for more details.

                    '
                  example: true
                with_quality_scores__products:
                  type: boolean
                  description: Return product quality scores in the response
                  example: true
                with_readiness:
                  type: string
                  enum:
                  - scores_only
                  - detailed
                  description: 'Return product readiness in the response.

                    `scores_only` returns percentage scores only; `detailed` also returns unmet requirements.


                    Readiness is currently in beta and is available by request only. If you would like to participate, please reach out to your Customer Success Manager.

                    '
                  example: detailed
                with_completenesses:
                  type: boolean
                  description: Return product completenesses in the response
                  example: true
                with_workflow_execution_statuses:
                  type: boolean
                  description: Return an array of workflow_execution_statuses in the response
                  example: true
            examples:
              searchProductsWithCriteria:
                summary: Search for products with specific criteria on scope, locale and completeness
                value:
                  scope: ecommerce
                  locales: en_US
                  search: '{"completeness":[{"operator": "=","value": 100,"scope":"ecommerce"}]}'
                  attributes: description, name
                  with_attribute_options: false
                  with_asset_share_links: true
                  with_quality_scores__products: true
                  with_completenesses: true
              searchProductsWithAttributeValues:
                summary: Search for products with value for specific attributes
                value:
                  attributes: sku, colors, a_localized_and_scopable_text_area
                  scope: tablet
              searchProductsByReadiness:
                summary: Search for products by their readiness score for a a given readiness configuration and channel/locale
                value:
                  scope: ecommerce
                  search: '{"readiness":[{"operator":"=","value":100,"readiness_code":"camcorders_ecommerce","scope":"ecommerce","locale":"en_US"}]}'
        required: false
      responses:
        '200':
          description: 'Returns products paginated.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Products
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 3
                    items_count:
                      type: integer
                      description: Total number of items (only if `with_count` parameter is set to true)
                      example: 5
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              properties:
