                                          example: https://demo.akeneo.com/api/rest/v1/products-uuid/top
                            - type: object
                              properties:
                                uuid:
                                  type: string
                                  description: Product UUID
                                  example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                enabled:
                                  type: boolean
                                  description: Whether the product is enabled
                                  default: true
                                  example: true
                                family:
                                  type:
                                  - string
