      summary: Update/create several products
      description: 'This endpoint allows you to update and/or create several products at once.

        Learn more about Update behavior.

        Note that if no product exists for the given uuid, it creates it.

        Permissions based on your user groups are applied to the products you try to update.

        It may result in the creation of drafts if you only have edit rights through the product''s categories.'
