openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Product [uuid] API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Product [uuid]
  description: 'A product is a single item that can be managed in the PIM.

    It can have various attributes and values, and can be associated with product models, categories, and other entities.

    Products are the core entities in the PIM and are used to manage the product information.

    We strongly recommend using this endpoint for its reliability and flexibility.

    UUIDs, or Universally Unique Identifiers, are guaranteed to be unique and never change, even if other product identifiers like SKUs are modified.

    This ensures consistent product identification regardless of future changes.

    Additionally, UUIDs allow interaction with products that lack a traditional identifier.'
paths:
  /api/rest/v1/products-uuid:
    get:
      operationId: get_products_uuid
      x-visibility: public
      summary: Get list of products
      description: 'This endpoint allows you to get a list of products.

        Products are paginated and they can be filtered.

        Permissions based on your user groups are applied to the set of products you request.'
      tags:
      - Product [uuid]
      security:
      - bearerToken: []
      parameters:
      - name: search
        in: query
        description: Filter products, for more details see the [Filters](https://api.akeneo.com/documentation/filter.html) section
        required: false
        schema:
          type: string
        examples:
          getProductsByProductUuid:
            summary: Filter the products by their uuid
            value: '{"uuid":[{"operator":"IN","value":["8945388d-cf5b-49af-8799-05d1ed6e296f", "941fe892-99dd-440f-b2a9-8eccb94248f0"]}]}'
          getProductsByCategory:
            summary: Filter the products by their category
            value: '{"categories":[{"operator":"IN","value":["winter_collection"]}]}'
          getProductsByCategoryButNotInAnother:
            summary: Filter the products categorized on the Winter Collection category and that are not categorized on the Accessories category
            value: '{"categories":[{"operator":"IN","value":["winter_collection"]},{"operator":"NOT IN","value":["accessories"]}]}'
          getProductsByStatus:
            summary: Filter the products by their status
            value: '{"enabled":[{"operator":"=","value":false}]}'
          getProductsByCompleteness:
            summary: Filter the products by their completeness
            value: '{"completeness":[{"operator":"=","value":50,"scope":"ecommerce"}]}'
          getProducts100PercentComplete:
            summary: Filter the products that are 100% complete on both the en_US and fr_FR locales for the ecommerce channel
            value: '{"completeness":[{"operator":"GREATER OR EQUALS THAN ON ALL LOCALES","value":100,"locales":["en_US","fr_FR"],"scope":"ecommerce"}]}'
          getProductsByGroup:
            summary: Filter the products by their group
            value: '{"groups":[{"operator":"IN","value":["promotion"]}]}'
          getProductsByFamily:
            summary: Filter the products by their family
            value: '{"family":[{"operator":"NOT IN","value":["camcorders","digital_cameras"]}]}'
          getProductsByCreationDate:
            summary: Filter the products by their creation date
            value: '{"created":[{"operator":"=","value":"2016-07-04 10:00:00"}]}'
          getProductsByUpdatedDate:
            summary: Filter the products updated since X days
            value: '{"updated":[{"operator":"SINCE LAST N DAYS","value":4}]}'
          getProductsUpdatedIncludingLinkedEntities:
            summary: Filter the products by their update date including linked entity changes
            value: '{"updated_including_linked_entities":[{"operator":">","value":"2025-01-01 00:00:00"}]}'
          getProductsUpdatedIncludingLinkedEntitiesSinceLastNDays:
            summary: Filter the products updated (including linked entity changes) since N days
            value: '{"updated_including_linked_entities":[{"operator":"SINCE LAST N DAYS","value":7}]}'
          getProductsUpdatedIncludingLinkedEntitiesWithSpecificTypes:
            summary: Filter the products by update date including only specific linked entity types
            value: '{"updated_including_linked_entities":[{"operator":">","value":"2025-01-01 00:00:00"}],"updated_including_linked_type":[{"operator":"IN","value":["asset","reference_entity_record"]}]}'
          getProductsUpdatedIncludingLinkedEntitiesAssetsOnly:
            summary: Filter the products by update date including only asset changes
            value: '{"updated_including_linked_entities":[{"operator":"SINCE LAST N DAYS","value":7}],"updated_including_linked_type":[{"operator":"IN","value":["asset"]}]}'
          getVariantProductsByProductModelCode:
            summary: Filter the variant products by their parent
            value: '{"parent":[{"operator":"IN","value":["tops"]}]}'
          getVariantProductsBySubProductModelCodes:
            summary: Filter the variant products by their sub product model
            value: '{"parent":[{"operator":"IN","value":["tshirt_armor_blue","tshirt_armor_red"]}]}'
          getAllVariantProducts:
            summary: Get all variant products
            value: '{"parent":[{"operator":"NOT EMPTY"}]}'
          getAllSimpleProducts:
            summary: Get all simple products
            value: '{"parent":[{"operator":"EMPTY"}]}'
          getProductsByQualityScore:
            summary: Filter the products with a "D" for the ecommerce channel and en_US locale
            value: '{"quality_score":[{"operator":"IN","value":["D"],"scope":"ecommerce","locale":"en_US"}]}'
          getProductsWithMultipleQualityScores:
            summary: Filter the products with an "A" or "B" for the mobile channel and en_GB locale
            value: '{"quality_score":[{"operator":"IN","value":["A","B"],"scope":"mobile","locale":"en_GB"}]}'
          getProductsByReadinessAt100PercentOnAGivenChannelAndLocale:
            summary: Filter the products by their readiness score for a given readiness configuration and channel/locale
            value: '{"readiness":[{"operator":"=","value":100,"readiness_code":"camcorders_ecommerce","scope":"ecommerce","locale":"en_US"}]}'
          getProductByReadinessGreaterThan50PercentOnGivenLocales:
            summary: Filter the products by their readiness score for a given readiness configuration, channel and list of locales
            value: '{"readiness":[{"operator":"GREATER THAN ON ALL LOCALES","value":50,"readiness_code":"camcorders_ecommerce","scope":"ecommerce","locales":["en_US","fr_FR"]}]}'
          getEnabledProducts:
            summary: Get only enabled products
            value: '{"enabled":[{"operator":"=","value":true}]}'
          getEnabledProductsCompleteAtLeast70Percent:
            summary: Get only enabled products that are at least 70% complete on the ecommerce channel
            value: '{"enabled":[{"operator":"=","value":true}],"completeness":[{"operator":">","value":70,"scope":"ecommerce"}]}'
          getProductsByAttributeValue:
            summary: Filter the products by an attribute value
            value: '{"main_color":[{"operator":"IN","value":["purple"]}]}'
          getProductsWithSpecificDescription:
            summary: Filter the products having a description begining with Amazing on the en_US locale
            value: '{"description":[{"operator":"STARTS WITH","value":"Amazing","locale":"en_US"}]}'
          getProductsWithSpecificReleaseDate:
            summary: Filter the products that have a release date due after the 4th of July 2016 for the ecommerce channel
            value: '{"release_date":[{"operator":">","value":"2016-07-04","scope":"ecommerce"}]}'
          getProductsByDateOnly:
            summary: Filter products on a `pim_catalog_date` attribute using a full-day range (date-only)
            value: '{"release_date":[{"operator":"=","value":"2024-06-15","scope":"ecommerce"}]}'
          getProductsByIso8601DateTime:
            summary: Filter products on a `pim_catalog_date` attribute with `display_time` enabled using ISO 8601
            value: '{"release_date":[{"operator":"=","value":"2024-06-15T08:00:00Z","scope":"ecommerce"}]}'
          getProductsByDateRange:
            summary: Filter products on a `pim_catalog_date` attribute with a date-only range
            value: '{"release_date":[{"operator":"BETWEEN","value":["2024-06-01","2024-06-30"],"scope":"ecommerce"}]}'
          getProductsByIso8601DateTimeRange:
            summary: Filter products on a `pim_catalog_date` attribute with `display_time` enabled with an ISO 8601 range
            value: '{"release_date":[{"operator":"BETWEEN","value":["2024-06-15T08:00:00+00:00","2024-06-15T18:00:00+00:00"],"scope":"ecommerce"}]}'
          getProductsByNumberRange:
            summary: Filter products on a `pim_catalog_number` attribute with a range
            value: '{"weight":[{"operator":"BETWEEN","value":[10,20]}]}'
          getProductsByNumberOutsideRange:
            summary: Filter products on a `pim_catalog_number` attribute outside a range
            value: '{"weight":[{"operator":"NOT BETWEEN","value":[10,20]}]}'
          getProductsByPriceRange:
            summary: Filter products on a `pim_catalog_price_collection` attribute with a range
            value: '{"price":[{"operator":"BETWEEN","value":{"amounts":[10,20],"currency":"EUR"}}]}'
          getProductsByPriceOutsideRange:
            summary: Filter products on a `pim_catalog_price_collection` attribute outside a range
            value: '{"price":[{"operator":"NOT BETWEEN","value":{"amounts":[10,20],"currency":"EUR"}}]}'
          getProductsByMetricRange:
            summary: Filter products on a `pim_catalog_metric` attribute with a range
            value: '{"weight":[{"operator":"BETWEEN","value":{"amounts":[10,20],"unit":"KILOGRAM"}}]}'
          getProductsByMetricOutsideRange:
            summary: Filter products on a `pim_catalog_metric` attribute outside a range
            value: '{"weight":[{"operator":"NOT BETWEEN","value":{"amounts":[10,20],"unit":"KILOGRAM"}}]}'
          getProductsContainingText:
            summary: Filter the products containing a text in the name attribute
            value: '{"name":[{"operator":"CONTAINS","value":"shirt","locale":"en_US","scope":"mobile"}]}'
          getProductsByMultipleAttributeValues:
            summary: Filter the products by multiple attribute values
            value: '{"description":[{"operator":"STARTS WITH","value":"Amazing","locale":"en_US","scope":"ecommerce"}],"main_color":[{"operator":"IN","value":["purple"]}]}'
          getProductsByMultipleAttributeConditions:
            summary: Filter the products by multiple attribute conditions
            value: '{"description":[{"operator":"NOT EMPTY","locale":"en_US","scope":"ecommerce"},{"operator":"EMPTY","locale":"fr_FR","scope":"ecommerce"}]}'
      - in: query
        name: scope
        description: 'Filter product values to return scopable attributes for the given channel as well as the non localizable/non scopable attributes.

          It is useful for retrieving product information specific to a particular sales channel, which is essential for channel-specific applications.

          For more details see the [Filter product values via channel](https://api.akeneo.com/documentation/filter.html#via-channel) section.

          '
        required: false
        schema:
          type: string
        example: ecommerce
      - in: query
        name: locales
        description: 'Filter product values to return localizable attributes for the given locales as well as the non localizable/non scopable attributes.

          It is useful for retrieving product information in specific languages, which is essential for multi-locale applications.

          For more details see the [Filter product values via locale](https://api.akeneo.com/documentation/filter.html#via-locale) section.

          '
        required: false
        schema:
          type: string
        example: en_US,fr_FR
      - in: query
        name: attributes
        description: 'Filter product values to only return those concerning the given attributes.

          It is useful for limiting the response to specific attributes, reducing payload size and improving performance.

          For more details see the [Filter product values via attributes](https://api.akeneo.com/documentation/filter.html#via-attributes) section.

          '
        required: false
        schema:
          type: string
        example: name,description
      - in: query
        name: pagination_type
        description: 'Specify which pagination method to use for navigating through large datasets.

          It is useful for choosing between different pagination strategies based on your specific use case and performance requirements.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          enum:
          - page
          - search_after
          default: page
        example: page
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: search_scope
        description: 'Filter scopes based on specific criteria.

          If you need to filter on several attributes on the same scope, you can use this parameter, to avoid repeating yourself for each attribute.

          For more details see the [Filters](https://api.akeneo.com/documentation/filter.html#search_scope-query-parameter) section.

          '
        required: false
        schema:
          type: string
        example: ecommerce
      - in: query
        name: search_locale
        description: 'Filter locales based on specific criteria.

          If you need to filter on several attributes on the same locale, you can use this parameter, to avoid repeating yourself for each attribute.

          For more details see the [Filters](https://api.akeneo.com/documentation/filter.html#search_locale-query-parameter) section.

          '
        required: false
        schema:
          type: string
        example: en_US
      - in: query
        name: convert_measurements
        description: 'Convert measurement attribute values to the appropriate unit for the channel provided by the `scope` parameter.


          When set to `true`, the `scope` parameter is required.

          '
        schema:
          type: boolean
          default: false
        required: false
        example: true
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_attribute_options
        description: 'Return labels of attribute options in the response.

          When set to `true`, the response will include human-readable labels for attribute options alongside their codes.

          This is useful for displaying human-readable labels instead of just option codes, which improves the user experience in frontend applications.

          If set to `false`, the response will only include option codes, which can improve performance.

          See [the `linked_data` format](https://api.akeneo.com/concepts/products.html#the-linked_data-format) section for more details.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_asset_share_links
        description: 'Return asset collection share link URLs in the response.

          When set to `true`, the response will include direct URLs to asset collections for sharing purposes.

          This is useful for accessing direct links to asset collections, which can be used for sharing or external integrations.

          If set to `false`, the response will not include share links, which can improve performance.

          See [the `linked_data` format](https://api.akeneo.com/concepts/products.html#the-linked_data-format) for more details.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_enabled_assets_only
        description: 'When set to `true`, disabled assets are excluded from asset collection values in the response.

          Only assets with `status: "enabled"` are returned.

          When set to `false` (default), all assets are returned regardless of their status.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_quality_scores
        description: 'Return product quality scores in the response.

          When set to `true`, the response will include quality score information for each product.

          This is useful for assessing and monitoring product data quality, which is essential for maintaining high data standards and improving product information.

          If set to `false`, the response will not include quality scores, which can improve performance.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_completenesses
        description: 'Return product completenesses information in the response.

          When set to `true`, the response will include detailed completeness information for each product.

          This is useful for understanding the data quality and completeness of products, which is essential for product management and quality assurance.

          If set to `false`, the response will not include completeness information, which can improve performance.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_readiness
        x-visibility: public
        description: 'Return readiness information in the response.

          - `scores_only`: include readiness percentage scores only.

          - `detailed`: include readiness percentage scores together with the list of unmet requirements.

          When omitted, no readiness information is returned.


          Readiness is currently in beta and is available by request only. If you would like to participate, please reach out to your Customer Success Manager.

          '
        required: false
        schema:
          type: string
          enum:
          - scores_only
          - detailed
        example: scores_only
      - in: query
        name: with_root_parent
        description: 'Return the root parent product model code of a variant in the response.

          When set to `true`, the response will include the root parent product model code for each variant product.

          This is useful for understanding the hierarchical relationship between product variants and their parent models, which is essential for product catalog navigation.

          If set to `false`, the response will not include parent model information, which can improve performance.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_workflow_execution_statuses
        description: 'Return an array of workflow_execution_statuses directly associated with the requested entity (product or product model) in the response.

          Statuses are level-specific and are not inherited from parent models. For a complete overview of a variant product, you must query the variant itself and its parent model(s) in separate requests.

          Each workflow object contains:

          - The overall execution status (e.g., in_progress, completed).

          - A list of all associated tasks.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: 'Returns products paginated.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Products
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 3
                    items_count:
                      type: integer
                      description: Total number of items (only if `with_count` parameter is set to true)
                      example: 5
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/products-uuid/top
                            - type: object
                              properties:
                                uuid:
                                  type: string
                                  description: Product UUID
                                  example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                enabled:
                                  type: boolean
                                  description: Whether the product is enabled
                                  default: true
                                  example: true
                                family:
                                  type:
                                  - string
                                  - 'null'
                                  description: '[Family](https://api.akeneo.com/api-reference.html#Family) code from which the product inherits its attributes and attributes requirements.

                                    In the case of variant product, the given family should be the same as the product model family.

                                    '
                                  default: null only in the case of a non variant product
                                  x-validation-rules: It is equal to an existing family code
                                  example: smartphone
                                categories:
                                  type: array
                                  description: Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) in which the product is classified
                                  items:
                                    type: string
                                  default: []
                                  x-validation-rules: Each string of the array is equal to an existing category code
                                  example:
                                  - smartphones
                                  - electronics
                                groups:
                                  type: array
                                  description: 'Codes of the groups to which the product belong.

                                    Each string of the array is equal to an existing group code.

                                    '
                                  items:
                                    type: string
                                  default: []
                                  x-validation-rules: Each string of the array is equal to an existing group code
                                  example:
                                  - summer_collection
                                  - sale
                                parent:
                                  type:
                                  - string
                                  - 'null'
                                  description: Code of the parent [product model](https://api.akeneo.com/api-reference.html#Productmodel) when the product is a variant
                                  default: null
                                  x-validation-rules: '- It is equal to an existing product model.

                                    - This product model has the same family variant as the one given in the `family_variant field`.

                                    '
                                  example: my_super_battery
                                root_parent:
                                  type: string
                                  readOnly: true
                                  description: 'Code of the root parent product model when the product is a variant

                                    (only available when the `with_root_parent` is set to `true`).

                                    '
                                  default: 'null'
                                  x-validation-rules: It is equal to an existing product model code only if the product is variant; otherwise, the property does not appear
                                  example: my_super_battery
                                values:
                                  type: object
                                  description: 'Product attributes values.

                                    Each key is an attribute code, and the value is an array of value objects for that attribute.

                                    See [documentation](https://api.akeneo.com/concepts/products.html#focus-on-the-product-values) for details.

                                    '
                                  patternProperties:
                                    ^\w+$:
                                      type: array
                                      items:
                                        type: object
                                        required:
                                        - data
                                        description: 'A value for a given attribute, for a given locale/scope combination.

                                          - locale: Locale code, or null if not localizable.

                                          - scope: Channel code, or null if not scopable.

                                          - data: The value for this attribute/locale/scope. Type and format depend on the attribute type (see Akeneo docs).

                                          - linked_data: Additional data for select/multiselect/asset attributes. Read-only.

                                          - attribute_type: The type of the value''s attribute. Read-only.

                                          - reference_data_name: Reference entity code or asset family code. Read-only.

                                          '
                                        properties:
                                          locale:
                                            type:
                                            - string
                                            - 'null'
                                            description: '[Locale](https://api.akeneo.com/api-reference.html#Locale) code of the product value'
                                            example: en_US
                                          scope:
                                            type:
                                            - string
                                            - 'null'
                                            description: '[Channel](https://api.akeneo.com/api-reference.html#Channel) code of the product value'
                                            example: ecommerce
                                          data:
                                            description: 'The value for this attribute/locale/scope. Type and format depend on the attribute type.

                                              - String for text, textarea, file, image, date, simple select, reference data simple select, reference entity.

                                              - Array of strings for multi select, reference data multi select, reference entity collection, asset collection, PAM asset collection.

                                              - Integer or string for number (depending on decimals_allowed).

                                              - Boolean for boolean attributes.

                                              - Object for metric, containing an "amount" (int), "unit" (string), and "symbol" (string, read-only) key.

                                              - Object for product link, containing a "type" (string) and "id" (string) key.

                                              - Object for table, containing different keys (int, boolean or string).

                                              - Object for price, with a "amount" (int) and a "currency" (string) key.

                                              '
                                            anyOf:
                                            - type: string
                                              description: 'A reference entity value.

                                                The string is the code of the reference entity.

                                                '
                                              example: designer_ref
                                            - type: array
                                              description: 'A reference entity collection value.

                                                The array contains codes of reference entities.

                                                '
                                              items:
                                                type: string
                                              example:
                                              - designer_ref_1
                                              - designer_ref_2
                                            - type: array
                                              description: 'An asset collection value.

                                                The array contains asset codes

                                                '
                                              items:
                                                type: string
                                              example:
                                              - left_side
                                              - right_side
                                            - type: boolean
                                              description: 'A boolean value.

                                                Used for attributes of type `pim_catalog_boolean`.

                                                '
                                              example: true
                                            - type: string
