                    In the case of variant product, the given family should be the same as the product model family.

                    '
                  default: null only in the case of a non variant product
                  x-validation-rules: It is equal to an existing family code
                  example: smartphone
                categories:
                  type: array
                  description: Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) in which the product is classified
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code
                  example:
                  - smartphones
                  - electronics
                add_categories:
                  type: array
                  description: 'Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) to add to the product.

                    Existing categories will be preserved.

                    '
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code. Cannot be used with the `categories` key
                  example:
                  - clothing
                  - shoes
                remove_categories:
                  type: array
                  description: 'Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) to remove from the product.

                    Other categories will be preserved.d

                    '
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code. Cannot be used with the `categories` key
