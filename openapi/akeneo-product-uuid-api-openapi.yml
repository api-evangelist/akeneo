    patch:
      operationId: patch_product_uuid_by_uuid
      x-visibility: public
      summary: Update/create a product
      description: 'This endpoint allows you to update a given product.

        Learn more about Update behavior.

        Note that if no product exists for the given uuid, it creates it.

        In the Enterprise Edition, permissions based on your user groups are applied to the product you try to update.

        It may result in the creation of a draft if you only have edit rights through the product''s categories.'
