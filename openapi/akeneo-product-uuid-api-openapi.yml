    post:
      operationId: post_product_uuid
      x-visibility: public
      summary: Create a new product
      description: 'This endpoint allows you to create a new product.

        Permissions based on your user groups are applied to the product you try to create.

        If no uuid is provided, the PIM will generate one for you.'
      tags:
      - Product [uuid]
      security:
      - bearerToken: []
      parameters:
      - in: query
        name: create_missing_options
        description: 'When present in the query string (regardless of value), automatically creates missing attribute options during product/product model creation or update.

          This only works for simple select and multi select attributes that have the `enable_option_creation_during_import` property set to `true` (configurable via the Attribute API).

          '
        required: false
        schema:
          type: string
        example: ''
      requestBody:
        description: Body of a product creation request
        content:
          application/json:
            schema:
              type: object
              properties:
                uuid:
                  type: string
                  description: Product UUID
                  example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                enabled:
                  type: boolean
                  description: Whether the product is enabled
                  default: true
                  example: true
                family:
                  type:
                  - string
                  - 'null'
                  description: '[Family](https://api.akeneo.com/api-reference.html#Family) code from which the product inherits its attributes and attributes requirements.

                    In the case of variant product, the given family should be the same as the product model family.

                    '
                  default: null only in the case of a non variant product
                  x-validation-rules: It is equal to an existing family code
                  example: smartphone
                categories:
                  type: array
                  description: Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) in which the product is classified
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code
                  example:
                  - smartphones
                  - electronics
                groups:
                  type: array
                  description: Codes of the groups to which the product belong
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing group code
                  example:
                  - summer_collection
                  - sale
                parent:
                  type:
                  - string
                  - 'null'
                  description: Code of the parent [product model](https://api.akeneo.com/api-reference.html#Productmodel) when the product is a variant
                  default: null
                  x-validation-rules: It is equal to an existing product model code only if the product is variant otherwise it's equal to null
                  example: my_super_battery
                values:
                  type: object
                  description: 'Product attributes values.

                    Each key is an attribute code, and the value is an array of value objects for that attribute.

                    See [documentation](https://api.akeneo.com/concepts/products.html#focus-on-the-product-values) for details.

                    '
                  patternProperties:
                    ^\w+$:
                      type: array
                      items:
                        type: object
                        required:
                        - data
                        description: 'A value for a given attribute, for a given locale/scope combination.

                          - locale: Locale code, or null if not localizable.

                          - scope: Channel code, or null if not scopable.

                          - data: The value for this attribute/locale/scope. Type and format depend on the attribute type (see Akeneo docs).

                          - linked_data: Additional data for select/multiselect/asset attributes. Read-only.

                          - attribute_type: The type of the value''s attribute. Read-only.

                          - reference_data_name: Reference entity code or asset family code. Read-only.

                          '
                        properties:
                          locale:
                            type:
                            - string
                            - 'null'
                            description: '[Locale](https://api.akeneo.com/api-reference.html#Locale) code of the product value'
                            example: en_US
                          scope:
                            type:
                            - string
                            - 'null'
                            description: '[Channel](https://api.akeneo.com/api-reference.html#Channel) code of the product value'
                            example: ecommerce
                          data:
                            description: 'The value for this attribute/locale/scope. Type and format depend on the attribute type.

                              - String for text, textarea, file, image, date, simple select, reference data simple select, reference entity.

                              - Array of strings for multi select, reference data multi select, reference entity collection, asset collection, PAM asset collection.

                              - Integer or string for number (depending on decimals_allowed).

                              - Boolean for boolean attributes.

                              - Object for metric, containing an "amount" (int), "unit" (string), and "symbol" (string, read-only) key.

                              - Object for product link, containing a "type" (string) and "id" (string) key.

                              - Object for table, containing different keys (int, boolean or string).

                              - Object for price, with a "amount" (int) and a "currency" (string) key.

                              '
                            anyOf:
                            - type: string
                              description: 'A reference entity value.

                                The string is the code of the reference entity.

                                '
                              example: designer_ref
                            - type: array
                              description: 'A reference entity collection value.

                                The array contains codes of reference entities.

                                '
                              items:
                                type: string
                              example:
                              - designer_ref_1
                              - designer_ref_2
                            - type: array
                              description: 'An asset collection value.

                                The array contains asset codes

                                '
                              items:
                                type: string
                              example:
                              - left_side
                              - right_side
                            - type: boolean
                              description: 'A boolean value.

                                Used for attributes of type `pim_catalog_boolean`.

                                '
                              example: true
                            - type: string
                              description: "A date value for attributes of type `pim_catalog_date`.\n\nTwo input formats are accepted:\n  - **Date only** (`YYYY-MM-DD`), for example `2021-04-29`.\n  - **ISO 8601 date-time**, either with a UTC offset (`YYYY-MM-DDTHH:MM:SS+00:00`) or in Zulu form (`YYYY-MM-DDTHH:MM:SSZ`), for example `2021-04-29T08:58:00Z`.\n\nThe ISO 8601 date-time form is only meaningful on attributes where `display_time` is enabled.\nOn attributes where `display_time` is `false`, the time component is ignored and the filter behaves as if a date-only value was provided.\n\nSpace-separated date-times (for example `2021-04-29 08:58:00`) are not supported and will be rejected.\n"
                              example: '2021-04-29T08:58:00Z'
                            - type: string
                              description: 'A file value.

                                The string is a file key referencing the uploaded file.

                                '
                              example: f/2/e/6/f2e6674e0766acdc70f814_myFile.pdf
                            - type: string
                              description: 'An identifier value.

                                Used for attributes of type `pim_catalog_identifier`.

                                '
                              example: SKU-12345
                            - type: string
                              description: 'An image value.

                                The string is a file key referencing the uploaded image.

                                '
                              example: 1/d/7/f/1d7f0987000cea4d14908fe679af4e36ea3632ef_10806799_1356.jpg
                            - type: object
                              description: 'A metric value.

                                Object with amount, unit, and symbol.

                                '
                              properties:
                                amount:
                                  description: 'The amount of the metric.

                                    - String representing a number if allowed on attribute settings ("decimals_allowed" parameter).

                                    - Integer if the attribute does not allow decimals.

                                    '
                                  oneOf:
                                  - type: string
                                    example: '800.0000'
                                  - type: integer
                                    example: 800
                                unit:
                                  type: string
                                  description: The unit of the metric
                                  example: GRAM
                                symbol:
                                  type: string
                                  description: The symbol of the unit, resolved from the measurement family definition. Read-only.
                                  readOnly: true
                                  example: g
                              required:
                              - amount
                              - unit
                              example:
                                amount: '800.0000'
                                unit: GRAM
                                symbol: g
                            - type: array
                              description: 'A multi select value.

                                The array contains option codes.

                                '
                              items:
                                type: string
                              example:
                              - summer_2017
                              - winter_2016
                            - anyOf:
                              - type: number
                              - type: string
                                pattern: ^\\d+(\\.\\d+)?$
                              description: 'A number value.

                                Used for attributes of type `pim_catalog_number`.

                                Can be integer or decimal, depending on attribute settings (`decimals_allowed` parameter).

                                '
                              example: 42.5
                            - type: array
                              description: 'A price collection value.

                                The array contains objects with amount and currency.

                                '
                              items:
                                type: object
                                required:
                                - amount
                                - currency
                                properties:
                                  amount:
                                    description: 'The amount of the price.

                                      - String representing a number if the attribute allows decimals.

                                      - Integer if the attribute does not allow decimals.

                                      '
                                    oneOf:
                                    - type: string
                                      example: '12.50'
                                    - type: integer
                                      example: 10
                                  currency:
                                    type: string
                                    description: The currency code
                                    example: USD
                              example:
                              - amount: '12.50'
                                currency: USD
                              - amount: 10
                                currency: EUR
                            - type: object
                              oneOf:
                              - type: object
                                description: Link to a product by UUID or identifier
                                required:
                                - type
                                - id
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - product
                                    description: The type of the linked entity
                                    example: product
                                  id:
                                    type: string
                                    description: The UUID of the linked product
                                    example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                additionalProperties: false
                              - type: object
                                description: Link to a product by identifier
                                required:
                                - type
                                - identifier
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - product
                                    description: The type of the linked entity
                                    example: product
                                  identifier:
                                    type:
                                    - string
                                    - 'null'
                                    description: The identifier of the linked product
                                    example: bl1850b
                                additionalProperties: false
                              - type: object
                                description: Link to a product model by code
                                required:
                                - type
                                - id
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - product_model
                                    description: The type of the linked entity
                                    example: product_model
                                  id:
                                    type: string
                                    description: The code of the linked product model
                                    example: my_super_battery
                                additionalProperties: false
                              description: "A product link value. Object with:\n  - type: 'product' or 'product_model'\n  - id: UUID (for product) or code (for product_model)\n  - identifier: identifier (for product)\nOnly one of id or identifier is present, depending on the type and linking method.\n"
                              example:
                                type: product
                                id: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                            - type: string
                              description: 'A simple select value.

                                The string is the option code.

                                '
                              example: black
                            - type: array
                              description: "A table value. Each item in the array is a row, represented as an object.\nEach key in the row object is a column code, and the value depends on the column type:\n  - string (for text, select, reference entity, date)\n  - integer or number (for number, depending on decimals_allowed)\n  - boolean (for yes/no)\n  - object (for product link, measurement, etc.)\nThe first column is always a select, reference entity, incremental number, or product link.\nThe table structure (columns and types) is defined in the attribute configuration.\n"
                              items:
                                type: object
                                description: 'The value for the column identified by the key.

                                  The type of the value depends on the column type defined in the attribute configuration.

                                  '
                                patternProperties:
                                  ^\w+$:
                                    oneOf:
                                    - type: string
                                      description: Text, select, reference entity, or date value
                                      example: value1
                                    - type: number
                                      description: Decimal value (number column, with or without decimals)
                                      example: 3.14
                                    - type: boolean
                                      description: Boolean value (yes/no column)
                                      example: true
                                    - type: object
                                      description: Product link value (see pim_catalog_product_link)
                                      required:
                                      - type
                                      properties:
                                        type:
                                          type: string
