openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Catalogs API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Catalogs
  description: 'A catalog is a collection of products that can be managed in the PIM.

    It allows you to create a subset of products that can be used in specific contexts, such as online stores, mobile applications, or print catalogs.

    Catalogs can have their own configurations, such as channels, locales, and measurement systems.'
paths:
  /api/rest/v1/catalogs:
    get:
      operationId: get_catalogs
      x-visibility: public
      summary: Get the list of owned catalogs
      description: This endpoint allows you to get the list of catalogs you owned
      tags:
      - Catalogs
      security:
      - appToken: []
      parameters:
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      x-app-token: true
      responses:
        '200':
          description: 'Return the paginated catalogs owned by the user making the request.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Catalogs
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 1
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            type: object
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/catalogs/12351d98-200e-4bbc-aa19-7fdda1bd14f2
                            - type: object
                              properties:
                                id:
                                  type: string
                                  description: Catalog id
                                  x-immutable: true
                                  example: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
                                name:
                                  type: string
                                  description: Catalog name
                                  example: My app catalog
                                enabled:
                                  type: boolean
                                  description: Whether the catalog is enabled or not
                                  default: false
                                  example: false
                                managed_currencies:
                                  type: array
                                  description: List of currency codes
                                  items:
                                    type: string
                                  example:
                                  - EUR
                                  - USD
                                  - GBP
                                managed_locales:
                                  type: array
                                  description: List of locale codes
                                  items:
                                    type: string
                                  example:
                                  - fr_FR
                                  - en_US
                              example:
                                id: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
                                name: My app catalog
                                enabled: false
                                managed_currencies:
                                - EUR
                                - USD
                                - GBP
                                managed_locales:
                                - fr_FR
                                - en_US
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/catalogs?page=3&limit=2
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/catalogs?page=1&limit=2
                  previous:
                    href: https://demo.akeneo.com/api/rest/v1/catalogs?page=2&limit=2
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/catalogs?page=4&limit=2
                current_page: 3
                _embedded:
                  items:
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/catalogs/12351d98-200e-4bbc-aa19-7fdda1bd14f2
                    id: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
                    name: Store EUROPE
                    enabled: false
                    managed_currencies:
                    - EUR
                    - GBP
                    managed_locales:
                    - fr_FR
                    - en_UK
                    - de_DE
                    - it_IT
                    - es_ES
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/catalogs/092c5f22-ecd8-485f-97e9-3b78098e1386
                    id: 092c5f22-ecd8-485f-97e9-3b78098e1386
                    name: Store US
                    enabled: true
                    managed_currencies:
                    - USD
                    managed_locales:
                    - en_US
                    - es_ES
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
    post:
      operationId: post_catalog
      x-visibility: public
      summary: Create a new catalog
      description: This endpoint allows you to create a new catalog
      tags:
      - Catalogs
      security:
      - appToken: []
      x-app-token: true
      requestBody:
        description: The catalog to create
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Catalog name
                  example: My app catalog
                managed_currencies:
                  type: array
                  description: List of currency codes
                  items:
                    type: string
                  example:
                  - EUR
                  - USD
                  - GBP
                managed_locales:
                  type: array
                  description: List of locale codes
                  items:
                    type: string
                  example:
                  - fr_FR
                  - en_US
            example:
              name: My app catalog
              managed_currencies:
              - EUR
              - USD
              - GBP
              managed_locales:
              - fr_FR
              - en_US
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Catalog id
                    x-immutable: true
                    example: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
                  name:
                    type: string
                    description: Catalog name
                    example: My app catalog
                  enabled:
                    type: boolean
                    description: Whether the catalog is enabled or not
                    default: false
                    example: false
                  managed_currencies:
                    type: array
                    description: List of currency codes
                    items:
                      type: string
                    example:
                    - EUR
                    - USD
                    - GBP
                  managed_locales:
                    type: array
                    description: List of locale codes
                    items:
                      type: string
                    example:
                    - fr_FR
                    - en_US
                example:
                  id: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
                  name: My app catalog
                  enabled: false
                  managed_currencies:
                  - EUR
                  - USD
                  - GBP
                  managed_locales:
                  - fr_FR
                  - en_US
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '415':
          description: 'This response indicates that the `Content-type` header of the request is not supported by the server.

            The server expects the `Content-type` header to be `application/json`, and any other value will result in this error.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 415
                message: xxx in `Content-type` header is not valid.  Only `application/json` is allowed."
        '422':
          description: 'This response indicates that the validation of the entity given in the body of the request failed.

            It occurs when the server understands the request but cannot process it due to validation errors in the provided data.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 422
                  message:
                    type: string
                    description: Message explaining the error
                    example: Validation failed.
                  errors:
                    type: array
                    description: A list of validation error messages (optional)
                    items:
                      type: object
                      properties:
                        property:
                          type: string
                          description: Name of the invalid property
                        message:
                          type: string
                          description: Human-readable error message
                        attribute:
                          type:
                          - string
                          - 'null'
                          description: Attribute code (if the error is on an attribute)
                        locale:
                          type:
                          - string
                          - 'null'
                          description: Locale code involved in the error, if any
                        scope:
                          type:
                          - string
                          - 'null'
                          description: Channel code involved in the error, if any
                    example:
                    - property: family
                      message: The tshirts family does not exist in your PIM.
                  _links:
                    type: object
                    properties:
                      documentation:
                        type: object
                        properties:
                          href:
                            type: string
                    example:
                      documentation:
                        href: http://api.akeneo.com/api-reference.html
              example:
                code: 422
                message: Validation failed.
                errors:
                - property: family
                  message: The tshirts family does not exist in your PIM.
                - property: categories
                  message: The "tvs_projectors" category does not exist.
                - property: associations.SUBSTITUTION.groups
                  message: You should associate existing groups. The "promotion" group does not exist.
                - property: values
                  message: The "description" attribute requires a channel.
                  attribute: description
                  locale: en_US
                  scope: null
                - property: values
                  message: The "name" attribute requires a locale.
                  attribute: name
                  locale: null
                  scope: null
                _links:
                  documentation:
                    href: http://api.akeneo.com/api-reference.html
  /api/rest/v1/catalogs/{id}:
    get:
      operationId: get_catalog_by_id
      x-visibility: public
      summary: Get a catalog
      description: This endpoint allows you to get the information about a catalog
      tags:
      - Catalogs
      security:
      - appToken: []
      parameters:
      - in: path
        name: id
        description: 'This path parameter is used to specify the unique identifier of the catalog you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the catalog ID is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
          format: uuid
        example: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
      x-app-token: true
      responses:
        '200':
          description: Return the catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Catalog id
                    x-immutable: true
                    example: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
                  name:
                    type: string
                    description: Catalog name
                    example: My app catalog
                  enabled:
                    type: boolean
                    description: Whether the catalog is enabled or not
                    default: false
                    example: false
                  managed_currencies:
                    type: array
                    description: List of currency codes
                    items:
                      type: string
                    example:
                    - EUR
                    - USD
                    - GBP
                  managed_locales:
                    type: array
                    description: List of locale codes
                    items:
                      type: string
                    example:
                    - fr_FR
                    - en_US
                example:
                  id: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
                  name: My app catalog
                  enabled: false
                  managed_currencies:
                  - EUR
                  - USD
                  - GBP
                  managed_locales:
                  - fr_FR
                  - en_US
              example:
                id: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
