    delete:
      operationId: delete_supplier_user_access
      x-visibility: public
      summary: Revoke a supplier user's access
      description: 'This endpoint allows you to revoke a user''s access to a supplier organization.


        It detaches the user from this supplier only: the user account itself is kept, and its access to

        any other supplier organization it belongs to is left untouched. There is no endpoint to delete a

        supplier user account outright — that is deliberately out of the scope of this API.


        The call is not idempotent: once the access is revoked the user is no longer a member of this

        supplier, so calling it again answers 404. Retrying a call that timed out may therefore return a

        404 that means "already revoked" rather than "never existed".'
      tags:
      - Supplier
      security:
      - bearerToken: []
      parameters:
      - name: code
        in: path
        required: true
        description: Code of the supplier organization, the reference you gave it on creation
        schema:
          type: string
        example: ERP-4471
      - name: user_uuid
        in: path
        required: true
        description: Identifier of the supplier user
        schema:
          type: string
          format: uuid
        example: 7b3c1d9e-2a4f-4b6c-8d1e-3f5a7c9b2d40
      responses:
        '204':
          description: 'No content to return.

            Means that the user no longer has access to this supplier.

            '
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

