    patch:
      operationId: patch_supplier_users
      x-visibility: public
      summary: Invite or update supplier users
      description: 'This endpoint allows you to invite users into a supplier organization, and to update the ones

        already known, in a single call. Up to 100 users per call.


        A user is identified by their email. An email the PIM does not know yet creates a user and

        returns the identifier it generated for them; an email it already knows attaches that user to

        this supplier if they are not a member yet. Replaying a call is therefore safe: it never invites

        the same person twice.


        An entry describes the user in full: `email`, `first_name` and `last_name` are all required, every

        time. A caller never has to know whether the PIM already holds the email, and the names it sends

        are the ones stored — so the system sending them stays the reference for a contributor''s profile.


        The response is an array holding one result per user sent, in the same order, so a result is

        matched to its entry by position.


        An email sent twice in the same call is refused on its second entry with a `422`, rather than

        letting one entry quietly overwrite the other.


        Each user is processed on their own and reported on their own: one failing does not stop the

        others, and the users of the successful entries stay invited. Attaching a member is also written

        to the identity provider, which is why the batch is not rolled back — undoing those attachments

        one by one would be more failure-prone than the failure it is undoing.


        Each user invited for the first time into this supplier receives a notification email, so

        inviting 100 new members sends 100 emails. An entry that only updates a name sends none.


        **Invitations are queued, not sent while you wait.** A result''s `status_code` is `202` when the

        entry was accepted and will be invited shortly, or `422` for a payload the endpoint refuses —

        a malformed address is still caught immediately. The call itself answers `200`; a body that is

        not a JSON array is refused with `400`, and more than 100 entries with `413`, before any of them

        is processed.


        An accepted entry carries no `user_uuid`: the identifier does not exist until the invitation has

        been processed. Read `GET /api/rest/v1/suppliers/{code}/users` to see who has actually been

        invited, and to get their identifiers.


        Queuing is what makes a large batch safe. The identity provider caps how many invitations it

        accepts per minute, tenant-wide; sending them inline meant a big batch held the connection open

        for tens of seconds and lost whatever the provider refused.'
      tags:
      - Supplier
      security:
      - bearerToken: []
      parameters:
      - name: code
        in: path
        required: true
        description: Code of the supplier organization, the reference you gave it on creation
        schema:
          type: string
        example: ERP-4471
      requestBody:
        description: The supplier users to invite or update
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                type: object
                required:
                - email
                - first_name
                - last_name
                properties:
                  email:
                    type: string
                    format: email
                    description: Email the user signs in with, and what identifies them
                    example: ada@acme-components.test
                  first_name:
                    type: string
                    example: Ada
                  last_name:
                    type: string
                    example: Lovelace
            example:
            - email: ada@acme-components.test
              first_name: Ada
              last_name: Lovelace
            - email: grace@acme-components.test
              first_name: Grace
              last_name: Hopper
      responses:
        '200':
          description: One result per supplier user sent, in the same order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: Email of the supplier user of this entry
                      example: ada@acme-components.test
                    status_code:
                      type: integer
                      description: HTTP status code, see [Client errors](https://api.akeneo.com/documentation/responses.html#client-errors) to understand the meaning of each code
                      example: 202
                    message:
                      type: string
                      description: Message explaining the error
                      example: Validation failed.
                    errors:
                      type: array
                      description: The properties the entry was refused on
                      items:
                        type: object
                        properties:
                          property:
                            type: string
                            example: first_name
                          message:
                            type: string
                            example: first_name is required and must be a string
              example:
              - email: ada@acme-components.test
                status_code: 202
              - email: grace@acme-components.test
                status_code: 202
              - email: turing@acme-components.test
                status_code: 422
                message: Validation failed.
                errors:
                - property: first_name
                  message: first_name is required and must be a string
