openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Catalog products API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Catalog products
  description: 'A catalog contains a selection of products from the PIM, intended to be synchronized with a third-party application via the API.

    The Catalog products endpoint allows you to retrieve the list of products for a given catalog, with options to filter, paginate, and select the returned fields.

    Each returned product includes its attributes, values, status information, and associated references, all in the context of the catalog.

    This endpoint is mainly used by Apps to synchronize product data between Akeneo PIM and external platforms, while respecting access rights and catalog configuration.'
paths:
  /api/rest/v1/catalogs/{id}/product-uuids:
    get:
      operationId: get_catalog_product_uuids
      x-visibility: public
      summary: Get the list of product uuids
      description: 'This endpoint allows you to get the list of uuids of products contained in a catalog.

        Please, note that a disabled catalog can return an HTTP 200 with a payload containing an error message,

        for more details see the App Catalog section.'
      tags:
      - Catalog products
      x-app-token: true
      security:
      - appToken: []
      parameters:
      - in: path
        name: id
        description: 'This path parameter is used to specify the unique identifier of the catalog you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the catalog ID is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
          format: uuid
        example: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: updated_before
        description: 'Filter products that have been updated BEFORE the provided date.

          It is useful for retrieving products that haven''t been modified since a specific date, which is essential for historical data analysis and reporting.

          This filter uses the PIM products updated date and is only available on Catalogs endpoints.

          '
        required: false
        schema:
          type: string
          format: date
        example: '2025-05-17T10:00:00Z'
      - in: query
        name: updated_after
        description: 'Filter products that have been updated AFTER the provided date.

          It is useful for retrieving only recently modified products, which is essential for synchronization and incremental data processing.

          This filter uses the PIM products updated date and is only available on Catalogs endpoints.

          '
        required: false
        schema:
          type: string
          format: date
        example: '2025-06-17T10:00:00Z'
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: 'Return the paginated product uuids.

            The response is paginated and includes links to navigate through the pages.

            Only `search_after` pagination is used.

            '
          content:
            application/json:
              schema:
                title: Product uuids
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    items_count:
                      type: integer
                      description: Total number of items (only if `with_count` parameter is set to true)
                      example: 5
                    _embedded:
                      type: object
                      required:
                      - items
                      properties:
                        items:
                          type: array
                          items:
                            type: string
                            format: uuid
                            example: 4756e653-e25d-48c1-bb72-adce7b1366fd
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/catalogs/12351d98-200e-4bbc-aa19-7fdda1bd14f2/product-uuids&with_count=true
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/catalogs/12351d98-200e-4bbc-aa19-7fdda1bd14f2/product-uuids&with_count=true
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/catalogs/12351d98-200e-4bbc-aa19-7fdda1bd14f2/product-uuids?search_after=eddfbd2a-abc7-488d-b9e3-41289c824f80&with_count=true
                items_count: 10
                _embedded:
                  items:
                  - 844c736b-a19b-48a6-a354-6056044729f0
                  - b2a683ef-4a91-4ed3-b3fa-76dab065a8d5
                  - eddfbd2a-abc7-488d-b9e3-41289c824f80
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '404':
          description: 'This response indicates that the requested resource could not be found on the server.

            It can occur when the resource code given in the URI does not correspond to any existing PIM resource.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 404
                message: Resource `my_resource_code` does not exist.
  /api/rest/v1/catalogs/{id}/products:
    get:
      operationId: get_catalog_products
      x-visibility: public
      summary: Get the list of products related to a catalog
      description: 'This endpoint allows you to get the list of products related to a catalog.

        Products are paginated and they can be filtered. In the Enterprise Edition,

        permissions based on your app settings are applied to the set of products you request.

        Please, note that a disabled catalog can return an HTTP 200 with a payload containing an error message,

        for more details see the App Catalog section.'
      tags:
      - Catalog products
      security:
      - appToken: []
      parameters:
      - in: path
        name: id
        description: 'This path parameter is used to specify the unique identifier of the catalog you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the catalog ID is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
          format: uuid
        example: 12351d98-200e-4bbc-aa19-7fdda1bd14f2
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: updated_before
        description: 'Filter products that have been updated BEFORE the provided date.

          It is useful for retrieving products that haven''t been modified since a specific date, which is essential for historical data analysis and reporting.

          This filter uses the PIM products updated date and is only available on Catalogs endpoints.

          '
        required: false
        schema:
          type: string
          format: date
        example: '2025-05-17T10:00:00Z'
      - in: query
        name: updated_after
        description: 'Filter products that have been updated AFTER the provided date.

          It is useful for retrieving only recently modified products, which is essential for synchronization and incremental data processing.

          This filter uses the PIM products updated date and is only available on Catalogs endpoints.

          '
        required: false
        schema:
          type: string
          format: date
        example: '2025-06-17T10:00:00Z'
      x-app-token: true
      responses:
        '200':
          description: 'Return the paginated products or error message.

            The response is paginated and includes links to navigate through the pages.

            Only `search_after` pagination is used.

            '
          content:
            application/json:
              schema:
                title: Catalog Products
                type: object
                oneOf:
                - allOf:
                  - type: object
                    properties:
                      _links:
                        type: object
                        properties:
                          self:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URI of the current page of resources
                                example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                          first:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URI of the first page of resources
                                example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                          previous:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URI of the previous page of resources
                                example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                          next:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URI of the next page of resources
                                example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        required:
                        - items
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                uuid:
                                  type: string
                                  description: Product UUID
                                  example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                enabled:
                                  type: boolean
                                  description: Whether the product is enabled
                                  default: true
                                  example: true
                                family:
                                  type:
                                  - string
                                  - 'null'
                                  description: '[Family](https://api.akeneo.com/api-reference.html#Family) code from which the product inherits its attributes and attributes requirements.

                                    In the case of variant product, the given family should be the same as the product model family.

                                    '
                                  default: null only in the case of a non variant product
                                  x-validation-rules: It is equal to an existing family code
                                  example: smartphone
                                categories:
                                  type: array
                                  description: Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) in which the product is classified
                                  items:
                                    type: string
                                  default: []
                                  x-validation-rules: Each string of the array is equal to an existing category code
                                  example:
                                  - smartphones
                                  - electronics
                                groups:
                                  type: array
                                  description: 'Codes of the groups to which the product belong.

                                    Each string of the array is equal to an existing group code.

                                    '
                                  items:
                                    type: string
                                  default: []
                                  x-validation-rules: Each string of the array is equal to an existing group code
                                  example:
                                  - summer_collection
                                  - sale
                                parent:
                                  type:
                                  - string
                                  - 'null'
                                  description: Code of the parent [product model](https://api.akeneo.com/api-reference.html#Productmodel) when the product is a variant
                                  default: null
                                  x-validation-rules: '- It is equal to an existing product model.

                                    - This product model has the same family variant as the one given in the `family_variant field`.

                                    '
                                  example: my_super_battery
                                root_parent:
                                  type: string
                                  readOnly: true
                                  description: 'Code of the root parent product model when the product is a variant

                                    (only available when the `with_root_parent` is set to `true`).

                                    '
                                  default: 'null'
                                  x-validation-rules: It is equal to an existing product model code only if the product is variant; otherwise, the property does not appear
                                  example: my_super_battery
                                values:
                                  type: object
                                  description: 'Product attributes values.

                                    Each key is an attribute code, and the value is an array of value objects for that attribute.

                                    See [documentation](https://api.akeneo.com/concepts/products.html#focus-on-the-product-values) for details.

                                    '
                                  patternProperties:
                                    ^\w+$:
                                      type: array
                                      items:
                                        type: object
                                        required:
                                        - data
                                        description: 'A value for a given attribute, for a given locale/scope combination.

                                          - locale: Locale code, or null if not localizable.

                                          - scope: Channel code, or null if not scopable.

                                          - data: The value for this attribute/locale/scope. Type and format depend on the attribute type (see Akeneo docs).

                                          - linked_data: Additional data for select/multiselect/asset attributes. Read-only.

                                          - attribute_type: The type of the value''s attribute. Read-only.

                                          - reference_data_name: Reference entity code or asset family code. Read-only.

                                          '
                                        properties:
                                          locale:
                                            type:
                                            - string
                                            - 'null'
                                            description: '[Locale](https://api.akeneo.com/api-reference.html#Locale) code of the product value'
                                            example: en_US
                                          scope:
                                            type:
                                            - string
                                            - 'null'
                                            description: '[Channel](https://api.akeneo.com/api-reference.html#Channel) code of the product value'
                                            example: ecommerce
                                          data:
                                            description: 'The value for this attribute/locale/scope. Type and format depend on the attribute type.

                                              - String for text, textarea, file, image, date, simple select, reference data simple select, reference entity.

                                              - Array of strings for multi select, reference data multi select, reference entity collection, asset collection, PAM asset collection.

                                              - Integer or string for number (depending on decimals_allowed).

                                              - Boolean for boolean attributes.

                                              - Object for metric, containing an "amount" (int), "unit" (string), and "symbol" (string, read-only) key.

                                              - Object for product link, containing a "type" (string) and "id" (string) key.

                                              - Object for table, containing different keys (int, boolean or string).

                                              - Object for price, with a "amount" (int) and a "currency" (string) key.

                                              '
                                            anyOf:
                                            - type: string
                                              description: 'A reference entity value.

                                                The string is the code of the reference entity.

                                                '
                                              example: designer_ref
                                            - type: array
                                              description: 'A reference entity collection value.

                                                The array contains codes of reference entities.

                                                '
                                              items:
                                                type: string
                                              example:
                                              - designer_ref_1
                                              - designer_ref_2
                                            - type: array
                                              description: 'An asset collection value.

                                                The array contains asset codes

                                                '
                                              items:
                                                type: string
                                              example:
                                              - left_side
                                              - right_side
                                            - type: boolean
                                              description: 'A boolean value.

                                                Used for attributes of type `pim_catalog_boolean`.

                                                '
                                              example: true
                                            - type: string
                                              description: "A date value for attributes of type `pim_catalog_date`.\n\nTwo input formats are accepted:\n  - **Date only** (`YYYY-MM-DD`), for example `2021-04-29`.\n  - **ISO 8601 date-time**, either with a UTC offset (`YYYY-MM-DDTHH:MM:SS+00:00`) or in Zulu form (`YYYY-MM-DDTHH:MM:SSZ`), for example `2021-04-29T08:58:00Z`.\n\nThe ISO 8601 date-time form is only meaningful on attributes where `display_time` is enabled.\nOn attributes where `display_time` is `false`, the time component is ignored and the filter behaves as if a date-only value was provided.\n\nSpace-separated date-times (for example `2021-04-29 08:58:00`) are not supported and will be rejected.\n"
                                              example: '2021-04-29T08:58:00Z'
                                            - type: string
                                              description: 'A file value.

                                                The string is a file key referencing the uploaded file.

                                                '
                                              example: f/2/e/6/f2e6674e0766acdc70f814_myFile.pdf
                                            - type: string
                                              description: 'An identifier value.

                                                Used for attributes of type `pim_catalog_identifier`.

                                                '
                                              example: SKU-12345
                                            - type: string
                                              description: 'An image value.

                                                The string is a file key referencing the uploaded image.

                                                '
                                              example: 1/d/7/f/1d7f0987000cea4d14908fe679af4e36ea3632ef_10806799_1356.jpg
                                            - type: object
                                              description: 'A metric value.

                                                Object with amount, unit, and symbol.

                                                '
                                              properties:
                                                amount:
                                                  description: 'The amount of the metric.

                                                    - String representing a number if allowed on attribute settings ("decimals_allowed" parameter).

                                                    - Integer if the attribute does not allow decimals.

                                                    '
                                                  oneOf:
                                                  - type: string
                                                    example: '800.0000'
                                                  - type: integer
                                                    example: 800
                                                unit:
                                                  type: string
                                                  description: The unit of the metric
                                                  example: GRAM
                                                symbol:
                                                  type: string
                                                  description: The symbol of the unit, resolved from the measurement family definition. Read-only.
                                                  readOnly: true
                                                  example: g
                                              required:
                                              - amount
                                              - unit
                                              example:
                                                amount: '800.0000'
                                                unit: GRAM
                                                symbol: g
                                            - type: array
                                              description: 'A multi select value.

                                                The array contains option codes.

                                                '
                                              items:
                                                type: string
                                              example:
                                              - summer_2017
                                              - winter_2016
                                            - anyOf:
                                              - type: number
                                              - type: string
                                                pattern: ^\\d+(\\.\\d+)?$
                                              description: 'A number value.

                                                Used for attributes of type `pim_catalog_number`.

                                                Can be integer or decimal, depending on attribute settings (`decimals_allowed` parameter).

                                                '
                                              example: 42.5
                                            - type: array
                                              description: 'A price collection value.

                                                The array contains objects with amount and currency.

                                                '
                                              items:
                                                type: object
                                                required:
                                                - amount
                                                - currency
                                                properties:
                                                  amount:
                                                    description: 'The amount of the price.

                                                      - String representing a number if the attribute allows decimals.

                                                      - Integer if the attribute does not allow decimals.

                                                      '
                                                    oneOf:
                                                    - type: string
                                                      example: '12.50'
                                                    - type: integer
                                                      example: 10
                                                  currency:
                                                    type: string
                                                    description: The currency code
                                                    example: USD
                                              example:
                                              - amount: '12.50'
                                                currency: USD
                                              - amount: 10
                                                currency: EUR
                                            - type: object
                                              oneOf:
                                              - type: object
                                                description: Link to a product by UUID or identifier
                                                required:
                                                - type
                                                - id
                                                properties:
                                                  type:
                                                    type: string
                                                    enum:
                                                    - product
                                                    description: The type of the linked entity
                                                    example: product
                                                  id:
                                                    type: string
                                                    description: The UUID of the linked product
                                                    example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                                additionalProperties: false
                                              - type: object
                                                description: Link to a product by identifier
                                                required:
                                                - type
                                                - identifier
                                                properties:
                                                  type:
                                                    type: string
                                                    enum:
                                                    - product
                                                    description: The type of the linked entity
                                                    example: product
                                                  identifier:
                                                    type:
                                                    - string
                                                    - 'null'
                                                    description: The identifier of the linked product
                                                    example: bl1850b
                                                additionalProperties: false
                                              - type: object
                                                description: Link to a product model by code
                                                required:
                                                - type
                                                - id
                                                properties:
                                                  type:
                                                    type: string
                                                    enum:
                                                    - product_model
                                                    description: The type of the linked entity
                                                    example: product_model
                                                  id:
                                                    type: string
                                                    description: The code of the linked product model
                                                    example: my_super_battery
                                                additionalProperties: false
                                              description: "A product link value. Object with:\n  - type: 'product' or 'product_model'\n  - id: UUID (for product) or code (for product_model)\n  - identifier: identifier (for product)\nOnly one of id or identifier is present, depending on the type and linking method.\n"
                                              example:
                                                type: product
                                                id: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                            - type: string
                                              description: 'A simple select value.

                                                The string is the option code.

                                                '
                                              example: black
                                            - type: array
                                              description: "A table value. Each item in the array is a row, represented as an object.\nEach key in the row object is a column code, and the value depends on the column type:\n  - string (for text, select, reference entity, date)\n  - integer or number (for number, depending on decimals_allowed)\n  - boolean (for yes/no)\n  - object (for product link, measurement, etc.)\nThe first column is always a select, reference entity, incremental number, or product link.\nThe table structure (columns and types) is defined in the attribute configuration.\n"
                                              items:
                                                type: object
                                                description: 'The value for the column identified by the key.

                                                  The type of the value depends on the column type defined in the attribute configuration.

                                                  '
                                                patternProperties:
                                                  ^\w+$:
                                                    oneOf:
                                                    - type: string
                                                      description: Text, select, reference entity, or date value
                                                      example: value1
                                                    - type: number
                                                      description: Decimal value (number column, with or without decimals)
                                                      example: 3.14
                                                    - type: boolean
                                                      description: Boolean value (yes/no column)
                                                      example: true
                                                    - type: object
                                                      description: Product link value (see pim_catalog_product_link)
                                                      required:
                                                      - type
                                                      properties:
                                                        type:
                                                          type: string
                                                          enum:
                                                          - product
                                                          - product_model
                                                          description: The type of the linked entity
                                                          example: product
                                                        id:
                                                          type: string
                                                          description: The UUID (for product) or code (for product_model)
                                                          example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                                        identifier:
                                                          type: string
                                                          description: The identifier of the linked product (alternative to id for product)
                                                          example: bl1850b
                                                      additionalProperties: false
                                                    - type: object
