    get:
      operationId: get_category_templates
      x-visibility: public
      summary: Get a list of category templates
      description: 'This endpoint allows you to retrieve category templates and the attributes they define. Filter

        with the `category` query parameter to get the templates that apply to a given category.'
      tags:
      - Category
      security:
      - bearerToken: []
      parameters:
      - name: category
        in: query
        description: 'Code of a category. Returns only the templates that apply to that category''s tree; any category

          code is accepted, not only a tree root. Responds with a 404 when the category does not exist, and

          with an empty list when it exists but its tree has no template. Omit it to list every template.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'This endpoint allows you to retrieve category templates. Filter by category code to find the

            templates that apply to a given category, and the attributes each of them defines.

            '
          content:
            application/json:
              schema:
                title: Category templates
                type: array
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      format: uuid
                      description: UUID of the category template
                      example: 8f2b1c44-3d5e-4a71-b9c2-1e3f5a7b9d11
                    code:
                      type: string
                      description: Code of the category template
                      example: master_men_template
                    attributes:
                      type: array
                      description: 'Attributes of the template, ordered as they appear in the PIM. Deactivated attributes are not

                        listed, and their values are stripped from category reads as well. A category''s `values` may

                        still reference an attribute absent from this list if that attribute has been deleted rather

                        than deactivated; such values are historical and cannot be written.

                        '
                      example:
                      - code: seo_meta_title
                        uuid: 783d4957-a29b-4281-a9f5-c4621014dcfa
                        type: text
                        labels:
                          en_US: SEO meta title
                        order: 1
                        is_required: false
                        is_localizable: true
                        is_scopable: false
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            description: 'Code of the attribute. Send this in the `attribute_code` field of a category value. Note

                              that reading a category returns the composite form `{code}|{uuid}` instead; both are

                              accepted on write.

                              '
                            example: seo_meta_title
                          uuid:
                            type: string
                            format: uuid
                            description: UUID of the attribute, the second half of the composite `{code}|{uuid}`
                            example: 783d4957-a29b-4281-a9f5-c4621014dcfa
                          type:
                            type: string
                            description: Type of the attribute
                            example: text
                            enum:
                            - text
                            - textarea
                            - richtext
                            - image
                            - boolean
                            - simple_select
                            - multi_select
                            - asset_collection
                            - product_and_product_model_sort
                            - datetime
                            - reference_entity
                            - reference_entity_collection
                          labels:
                            type: object
                            description: 'Labels of the attribute, per locale. A locale whose label has been cleared is returned

                              with a `null` value.

                              '
                            additionalProperties:
                              type:
                              - string
                              - 'null'
                            example:
                              en_US: SEO meta title
                          order:
                            type: integer
                            description: Position of the attribute in the template
                            example: 1
                          is_required:
                            type: boolean
                            description: Whether a value is required for this attribute
                            example: false
                          is_localizable:
                            type: boolean
                            description: Whether the attribute holds one value per locale
                            example: true
                          is_scopable:
                            type: boolean
                            description: Whether the attribute holds one value per channel
                            example: false
                          options:
                            type: array
                            description: Allowed options. Present only for `simple_select` and `multi_select`.
                            items:
                              type: object
                              properties:
                                code:
                                  type: string
                                  example: summer
                                labels:
                                  type: object
                                  additionalProperties:
                                    type:
                                    - string
                                    - 'null'
                                  example:
                                    en_US: Summer
                          default_value:
                            description: 'Default value applied when a category is created. Present only when one is set. Returned

                              as stored, so it is not re-validated against `options`.

                              '
                            oneOf:
                            - type: string
                              example: summer
                            - type: boolean
                              example: false
                            - type: array
                              items:
                                type: string
                              example:
                              - summer
                            - type: object
                              additionalProperties: true
                            - type: 'null'
                          reference_entity:
                            type: string
                            description: 'Identifier of the referenced entity. Present only for `reference_entity` and

                              `reference_entity_collection`.

                              '
                            example: designer
                          asset_family:
                            type: string
                            description: 'Identifier of the asset family the asset codes must belong to. Present only for

                              `asset_collection`.

                              '
                            example: packshots
              example:
              - uuid: 8f2b1c44-3d5e-4a71-b9c2-1e3f5a7b9d11
                code: master_men_template
                attributes:
                - code: seo_meta_title
