openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Category API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Category
  description: 'A category is a way of classifying products.

    Categories constitute category trees and in Akeneo, you can have multiple category trees with an unlimited number of levels (categories, subcategories, subsubcategories..).'
paths:
  /api/rest/v1/categories:
    get:
      operationId: get_categories
      x-visibility: public
      summary: Get the list of categories
      description: 'This endpoint allows you to get a list of categories. Categories are paginated and sorted by `root/left`.

        You can filter the categories by using the `search` query parameter, which supports searching by category code or label.

        The response includes the category''s code, parent code, labels, values, and channel requirements.

        You can also specify the `with_position` query parameter to include the position of the category in its level.

        The `with_enriched_attributes` query parameter allows you to include enriched attributes.'
      tags:
      - Category
      security:
      - bearerToken: []
      parameters:
      - name: search
        in: query
        description: 'The `search` query parameter allows you to filter categories based on specific criteria.

          For more details see the [Filters section](https://api.akeneo.com/documentation/filter.html#filter-categories).

          '
        required: false
        schema:
          type: string
        examples:
          getOnlyRootCategories:
            summary: Filter the categories to get only root categories
            value: '{"is_root":[{"operator":"=","value":true}]}'
          getCategoriesByParent:
            summary: Filter the categories by parent
            value: '{"parent":[{"operator":"=","value":"categoryA"}]}'
          getCategoriesByCode:
            summary: Filter the categories by their code
            value: '{"code":[{"operator":"IN","value":["category_code1","category_code2"]}]}'
          getCategoriesByUpdatedDate:
            summary: Filter the categories by their update date
            value: '{"updated":[{"operator":">","value":"2021-05-17T10:00:00Z"}]}'
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_position
        description: 'Return information about the category''s position within its category tree.

          When set to `true`, the response will include the position of the category in its level, which can be useful for understanding the hierarchy and order of categories.

          If set to `false`, the response will not include this information, which can improve performance.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_enriched_attributes
        description: 'Return the attribute values of the category.

          When set to `true`, the response will include the values of all attributes associated with the category.

          This is useful for retrieving detailed information about the category''s attributes, such as their values and configurations.

          If set to `false`, the response will not include attribute values, which can improve performance

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: 'Return categories paginated.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Categories
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 2
                    items_count:
                      type: integer
                      description: Total number of items (only if `with_count` parameter is set to true)
                      example: 5
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/categories/winter_collection
                            - type: object
                              properties:
                                code:
                                  type: string
                                  description: Category code
                                  x-immutable: true
                                  example: winter_collection
                                parent:
                                  type:
                                  - string
                                  - 'null'
                                  description: Category code of the parent's category
                                  x-validation-rules: '- It is either equal to `null` or to an existing category code.

                                    - If equal to an existing category code, it cannot reference itself.

                                    '
                                  example: root_category
                                updated:
                                  type: string
                                  description: Date of the last update
                                  format: date-time
                                  readOnly: true
                                  example: '2021-05-21T11:32:00+02:00'
                                position:
                                  type: integer
                                  description: Position of the category in its level, start from 1 (only available when query parameter `with_position` is set to `true`)
                                  readOnly: true
                                  example: 1
                                labels:
                                  type: object
                                  default: {}
                                  patternProperties:
                                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                                      description: Category label for the specified locale
                                      type:
                                      - string
                                      - 'null'
                                      example: winter collection
                                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                                  example:
                                    en_US: Winter collection
                                    fr_FR: Collection hiver
                                    de_DE: Winter-Kollektion
                                channel_requirements:
                                  type: array
                                  description: 'List of Channel codes on which the category is required for products completeness.

                                    Only category trees can be required, not child categories.

                                    '
                                  items:
                                    type: string
                                  default: []
                                  example:
                                  - ecommerce
                                  - mobile
                                values:
                                  type: object
                                  description: Attribute values
                                  additionalProperties:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                        description: The attribute type
                                        example: textarea
                                      locale:
                                        type:
                                        - string
                                        - 'null'
                                        description: '[Locale](https://api.akeneo.com/api-reference.html#Locale) code of the attribute value'
                                        example: en_US
                                      channel:
                                        type:
                                        - string
                                        - 'null'
                                        description: '[Channel](https://api.akeneo.com/api-reference.html#Channel) code of the attribute value'
                                        example: ecommerce
                                      attribute_code:
                                        type: string
                                        description: The attribute code with its uuid (attributeCode|attributeUuid)
                                        example: description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26
                                      data:
                                        description: Attribute value
                                        oneOf:
                                        - type: string
                                          example: <p>Winter collection description</p>
                                        - type: boolean
                                          example: false
                                        - type: array
                                          items:
                                            oneOf:
                                            - type: string
                                              example: noticeA
                                            - type: object
                                              properties:
                                                product_uuid:
                                                  type: string
                                                  example: 12951d98-210e-4b1c-ab18-7fdgf1bd14f3
                                                product_model_code:
                                                  type: string
                                                  example: test_model_1
                                        - type: object
                                          properties:
                                            size:
                                              type: integer
                                              description: Size of the file in bytes
                                              example: 1401359
                                            extension:
                                              type: string
                                              description: File extension
                                              example: jpg
                                            file_path:
                                              type: string
                                              description: Path to the file in the storage
                                              example: 2/d/c/7/2dc791671d726e7438219d5dc7fd51a53d6bf2bb_IMG_7860.jpg
                                            mime_type:
                                              type: string
                                              description: MIME type of the file
                                              example: image/jpeg
                                            original_filename:
                                              type: string
                                              description: Original filename before upload
                                              example: IMG_7860.jpg
                                        example: <p>Winter collection description</p>
                                  example:
                                    description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26|ecommerce|en_US:
                                      data: <p>Winter collection description</p>
                                      type: textarea
                                      channel: ecommerce
                                      locale: en_US
                                      attribute_code: description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26
                                    image_1|871b8686-79b5-415c-9c6f-a38f8732dfb7|ecommerce|en_US:
                                      data:
                                        size: 1401359
                                        extension: jpg
                                        file_path: 2/d/c/7/2dc791671d726e7438219d5dc7fd51a53d6bf2bb_IMG_7860.jpg
                                        mime_type: image/jpeg
                                        original_filename: IMG_7860.jpg
                                      type: image
                                      channel: ecommerce
                                      locale: en_US
                                      attribute_code: image_1|871b8686-79b5-415c-9c6f-a38f8732dfb7
                                validations:
                                  type: object
                                  description: Category validations
                                  x-validation-rules: Only applicable to root category
                                  default: {}
                                  properties:
                                    max_categories_per_product:
                                      type: integer
                                      description: Maximum number of categories per product
                                    only_leaves:
                                      type: boolean
                                      description: Categorization restricted to the lowest level
                                    is_mandatory:
                                      type: boolean
                                      description: Category is mandatory for every product
                                  example:
                                    max_categories_per_product: 5
                                    only_leaves: true
                                    is_mandatory: false
                      example:
                        items:
                        - _links:
                            self:
                              href: https://demo.akeneo.com/api/rest/v1/categories/winter_collection
                          code: winter_collection
                          parent: null
                          updated: '2021-05-21T11:32:00+02:00'
                          position: 1
                          labels:
                            en_US: Winter collection
                            fr_FR: Collection hiver
                            de_DE: Winter-Kollektion
                          values:
                            description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26|ecommerce|en_US:
                              data: <p>Winter collection description</p>\n
                              type: textarea
                              channel: ecommerce
                              locale: en_US
                              attribute_code: description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26
                          channel_requirements:
                          - ecommerce
                          - mobile
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5&with_count=true
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5&with_count=true
                  previous:
                    href: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5&with_count=true
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5&with_count=true
                current_page: 2
                items_count: 10
                _embedded:
                  items:
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/categories/winter_collection
                    code: winter_collection
                    parent: null
                    updated: '2021-05-21T11:32:00+02:00'
                    position: 1
                    labels:
                      en_US: Winter collection
                      fr_FR: Collection hiver
                      de_DE: Winter-Kollektion
                    values:
                      description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26|ecommerce|en_US:
                        data: <p>Winter collection description</p>\n
                        type: textarea
                        channel: ecommerce
                        locale: en_US
                        attribute_code: description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26
                      image_1|871b8686-79b5-415c-9c6f-a38f8732dfb7|ecommerce|en_US:
                        data:
                          size: 1401359
                          extension: jpg
                          file_path: 2/d/c/7/2dc791671d726e7438219d5dc7fd51a53d6bf2bb_IMG_7860.jpg
                          mime_type: image/jpeg
                          original_filename: IMG_7860.jpg
                        type: image
                        channel: ecommerce
                        locale: en_US
                        attribute_code: image_1|871b8686-79b5-415c-9c6f-a38f8732dfb7
                    channel_requirements:
                    - ecommerce
                    - mobile
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/categories/woman
                    code: woman
                    parent: winter_collection
                    updated: '2021-04-21T10:41:02+02:00'
                    position: 1
                    labels:
                      en_US: Woman
                      fr_FR: Femme
                      de_DE: Damen
                    values: {}
                    channel_requirements:
                    - ecommerce
                    - mobile
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/categories/man
                    code: man
                    parent: winter_collection
                    updated: '2021-03-02T12:59:59+02:00'
                    position: 2
                    labels:
                      en_US: Man
                      fr_FR: Homme
                      de_DE: Herren
                    values: {}
                    channel_requirements: []
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/categories/kids
                    code: kids
                    parent: winter_collection
                    updated: '2021-01-03T12:40:00+02:00'
                    position: 3
                    labels:
                      en_US: kids
                      fr_FR: Enfant
                      de_DE: Kinder
                    values: {}
                    channel_requirements: []
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/categories/summer_collection
                    code: summer_collection
                    parent: null
                    updated: '2021-04-04T09:42:00+02:00'
                    position: 1
                    labels:
                      en_US: Summer collection
                      fr_FR: Collection été
                      de_DE: Sommer-Kollektion
                    values: {}
                    channel_requirements:
                    - print
        '400':
          description: 'This response indicates that the server cannot process the request due to a client error, such as malformed request syntax, invalid request message framing, or deceptive request routing.

            It is typically used when the server cannot understand the request due to invalid JSON or other client-side issues.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 400
                message: Invalid JSON message received
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '406':
          description: 'This response indicates that the server cannot produce a response matching the list of acceptable values defined in the request''s `Accept` header.

            It is typically used when the requested resource is not available in the requested format.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 406
                message: xxx in `Accept` header is not valid. Only `application/json` is allowed.
    post:
      operationId: post_category
      x-visibility: public
      summary: Create a new category
      description: 'This endpoint allows you to create a new category. You can specify the category''s code, parent category, labels, values, validations, and channel requirements.

        The request body should be in JSON format and include the necessary fields for the category.'
      tags:
      - Category
      security:
      - bearerToken: []
      requestBody:
        description: The category to be created
        content:
          application/json:
            schema:
              required:
              - code
              type: object
              properties:
                code:
                  type: string
                  description: Category code
                  x-immutable: true
                  example: winter_collection
                parent:
                  type:
                  - string
                  - 'null'
                  description: Category code of the parent's category
                  x-validation-rules: '- It is either equal to `null` or to an existing category code.

                    - If equal to an existing category code, it cannot reference itself.

                    '
                  example: root_category
                updated:
                  type: string
                  description: Date of the last update
                  format: date-time
                  readOnly: true
                  example: '2021-05-21T11:32:00+02:00'
                position:
                  type: integer
                  description: Position of the category in its level, start from 1 (only available when query parameter `with_position` is set to `true`)
                  readOnly: true
                  example: 1
                labels:
                  type: object
                  default: {}
                  patternProperties:
                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                      description: Category label for the specified locale
                      type:
                      - string
                      - 'null'
                      example: winter collection
                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                  example:
                    en_US: Winter collection
                    fr_FR: Collection hiver
                    de_DE: Winter-Kollektion
                channel_requirements:
                  type: array
                  description: 'List of Channel codes on which the category is required for products completeness.

                    Only category trees can be required, not child categories.

                    '
                  items:
                    type: string
                  default: []
                  example:
                  - ecommerce
                  - mobile
                values:
                  description: Attribute values
                  default: []
                  oneOf:
                  - type: array
                    description: Array format for attribute values
                    items:
                      type: object
                      properties:
                        locale:
                          type:
                          - string
                          - 'null'
                          description: '[Locale](https://api.akeneo.com/api-reference.html#Locale) code of the attribute value'
                          example: en_US
                        channel:
                          type:
                          - string
                          - 'null'
                          description: '[Channel](https://api.akeneo.com/api-reference.html#Channel) code of the attribute value'
                          example: ecommerce
                        attribute_code:
                          type: string
                          description: The attribute code with its uuid (attributeCode|attributeUuid)
                          example: description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26
                        data:
                          description: 'Attribute value.

                            It should be a `string` for Text and Text Area attributes,

                            a `boolean` for Yes/No attribute

                            and for Image attribute use the [create category media file endpoint](https://api.akeneo.com/api-reference.html#post_category_media_files).

                            It can also be `null` to remove the value.

                            '
                          oneOf:
                          - type: string
                            example: <p>Winter collection description</p>
                          - type: boolean
                            example: false
                          - type: array
                            description: Array of strings for asset collections or array of objects for product/product model sort
                            items:
                              oneOf:
                              - type: string
                                example: noticeA
                              - type: object
                                properties:
                                  product_uuid:
                                    type: string
                                    example: 12951d98-210e-4b1c-ab18-7fdgf1bd14f3
                                  product_model_code:
                                    type: string
                                    example: test_model_1
                          - type: object
                            properties:
                              size:
                                type: integer
                                description: Size of the file in bytes
                                example: 1401359
                              extension:
                                type: string
                                description: File extension
                                example: jpg
                              file_path:
                                type: string
                                description: Path to the file in the storage
                                example: 2/d/c/7/2dc791671d726e7438219d5dc7fd51a53d6bf2bb_IMG_7860.jpg
                              mime_type:
                                type: string
                                description: MIME type of the file
                                example: image/jpeg
                              original_filename:
                                type: string
                                description: Original filename before upload
                                example: IMG_7860.jpg
                          example: <p>Winter collection description</p>
                    example:
                    - data: <p>Winter collection description</p>
                      channel: ecommerce
                      locale: en_US
                      attribute_code: a_text_area_attribute
                    - data: false
                      channel: ecommerce
                      locale: null
                      attribute_code: a_boolean_attribute
                  - type: object
                    description: Object format for attribute values (legacy format)
                    additionalProperties:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The attribute type
                          example: textarea
                        locale:
                          type:
                          - string
                          - 'null'
                          description: '[Locale](https://api.akeneo.com/api-reference.html#Locale) code of the attribute value'
                          example: en_US
                        channel:
                          type:
                          - string
                          - 'null'
                          description: '[Channel](https://api.akeneo.com/api-reference.html#Channel) code of the attribute value'
                          example: ecommerce
                        attribute_code:
                          type: string
                          description: The attribute code with its uuid (attributeCode|attributeUuid)
                          example: description|96b88bf4-c2b7-4b64-a1f9-5d4876c02c26
                        data:
                          description: 'Attribute value.

                            It should be a `string` for Text and Text Area attributes,

                            a `boolean` for Yes/No attribute

                            and for Image attribute use the [create category media file endpoint](https://api.akeneo.com/api-reference.html#post_category_media_files).

                            It can also be `null` to remove the value.

                            '
                          oneOf:
                          - type: string
                            example: <p>Winter collection description</p>
                          - type: boolean
                            example: false
                          - type: array
                            description: Array of strings for asset collections or array of objects for product/product model sort
                            items:
                              oneOf:
                              - type: string
                                example: noticeA
                              - type: object
                                properties:
                                  product_uuid:
                                    type: string
                                    example: 12951d98-210e-4b1c-ab18-7fdgf1bd14f3
                                  product_model_code:
                                    type: string
                                    example: test_model_1
                          - type: object
                            properties:
                              size:
                                type: integer
                                description: Size of the file in bytes
                                example: 1401359
                              extension:
                                type: string
                                description: File extension
                                example: jpg
                              file_path:
