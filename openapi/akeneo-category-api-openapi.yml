    patch:
      operationId: patch_category_by_code
      x-visibility: public
      summary: Create or update a category
      description: 'This endpoint allows you to update a given category. Note that if no category exists for the given code, it creates it.

        You can specify the category''s code, parent category, labels, values, validations, and channel requirements.

        The request body should be in JSON format and include the necessary fields for the category.'
      tags:
      - Category
      security:
      - bearerToken: []
