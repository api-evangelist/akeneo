openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Association type API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Association type
  description: 'An association type is a way to define the relationship between products or product models.

    It allows you to create links between products, such as "related products", "up-sell products", or "cross-sell products".

    Association types are used to manage the relationships between products and to provide additional context to the product information.'
paths:
  /api/rest/v1/association-types:
    get:
      operationId: get_association_types
      x-visibility: public
      summary: Get a list of association types
      description: 'This endpoint allows you to get a list of association types.

        Association types are paginated and sorted by code.'
      tags:
      - Association type
      security:
      - bearerToken: []
      parameters:
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: 'Return association types paginated.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Association types
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 1
                    items_count:
                      type: integer
                      description: Total number of items (only if `with_count` parameter is set to true)
                      example: 5
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/association-types/X_SELL
                            - type: object
                              required:
                              - code
                              properties:
                                code:
                                  type: string
                                  description: Association type code
                                  example: upsell
                                labels:
                                  type: object
                                  description: Association type labels for each locale
                                  default: {}
                                  patternProperties:
                                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                                      description: Association type label for the locale
                                      type:
                                      - string
                                      - 'null'
                                      example: Upsell
                                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                                  example:
                                    en_US: Upsell
                                    fr_FR: Vente incitative
                                is_quantified:
                                  type: boolean
                                  description: When true, the association is a quantified association
                                  default: false
                                  example: true
                                is_two_way:
                                  type: boolean
                                  description: 'When true, the association is a bidirectional association. Created without it, a manual association type is

                                    one-way and an automatic one is bidirectional

                                    '
                                  example: false
                                rule:
                                  description: 'How an automatic association type relates products, null for a manual one. A non-null rule creates an automatic

                                    association type; a type never turns from manual to automatic or back.

                                    A non-null rule is answered with a `422` while product compatibility is not enabled on the PIM

                                    '
                                  example: null
                                  oneOf:
                                  - type: object
                                    description: How the compatibility relates products
                                    properties:
                                      enabled:
                                        type: boolean
                                        description: Whether the compatibility applies
                                        example: true
                                      base_product_selection:
                                        type: object
                                        description: 'Which products a side of the rule covers: the criteria they satisfy, all of them or any of them depending on

                                          `operator`. A criterion is either a filter, `{"field": "family", "operator": "IN", "value": ["tyres"]}`, or a

                                          nested group, `{"operator": "OR", "criteria": [...]}`, in the same filter format as `/products`.

                                          `product_typology` restricts the selection to levels of the variant hierarchy, as

                                          `{"field": "product_typology", "operator": "IN", "value": ["product-model", "product-variant"]}`, among

                                          `product-model`, `sub-product-model`, `product-simple` and `product-variant`. It only takes the `IN`

                                          operator and at least one level.

                                          A filter on an attribute takes `scope` and `locale` too, `null` when the attribute is not scopable or not

                                          localizable.

                                          Groups nest at most 5 levels deep, the selection itself included, and a group holds at most 25 criteria.

                                          No criterion means the selection covers every product of the catalog. Sending a selection means sending all

                                          of it.

                                          '
                                        additionalProperties: false
                                        required:
                                        - operator
                                        - criteria
                                        properties:
                                          operator:
                                            type: string
                                            enum:
                                            - AND
                                            - OR
                                            example: AND
                                          criteria:
                                            type: array
                                            maxItems: 25
                                            items:
                                              type: object
                                              description: A filter, or a nested group holding `operator` and `criteria` like the selection does
                                              additionalProperties: false
                                              properties:
                                                field:
                                                  type: string
                                                  example: family
                                                operator:
                                                  type: string
                                                  example: IN
                                                value:
                                                  description: The value the filter compares to, in the format its operator expects
                                                  example:
                                                  - tyres
                                                scope:
                                                  type:
                                                  - string
                                                  - 'null'
                                                locale:
                                                  type:
                                                  - string
                                                  - 'null'
                                                options:
                                                  type: object
                                                criteria:
                                                  type: array
                                                  items:
                                                    type: object
                                        example:
                                          operator: AND
                                          criteria:
                                          - field: family
                                            operator: IN
                                            value:
                                            - tyres
                                          - operator: OR
                                            criteria:
                                            - field: enabled
                                              operator: '='
                                              value: true
                                            - field: diameter
                                              operator: '='
                                              value: 17
                                              scope: null
                                              locale: null
                                      compatible_product_selection:
                                        type: object
                                        description: 'Which products a side of the rule covers: the criteria they satisfy, all of them or any of them depending on

                                          `operator`. A criterion is either a filter, `{"field": "family", "operator": "IN", "value": ["tyres"]}`, or a

                                          nested group, `{"operator": "OR", "criteria": [...]}`, in the same filter format as `/products`.

                                          `product_typology` restricts the selection to levels of the variant hierarchy, as

                                          `{"field": "product_typology", "operator": "IN", "value": ["product-model", "product-variant"]}`, among

                                          `product-model`, `sub-product-model`, `product-simple` and `product-variant`. It only takes the `IN`

                                          operator and at least one level.

                                          A filter on an attribute takes `scope` and `locale` too, `null` when the attribute is not scopable or not

                                          localizable.

                                          Groups nest at most 5 levels deep, the selection itself included, and a group holds at most 25 criteria.

                                          No criterion means the selection covers every product of the catalog. Sending a selection means sending all

                                          of it.

                                          '
                                        additionalProperties: false
                                        required:
                                        - operator
                                        - criteria
                                        properties:
                                          operator:
                                            type: string
                                            enum:
                                            - AND
                                            - OR
                                            example: AND
                                          criteria:
                                            type: array
                                            maxItems: 25
                                            items:
                                              type: object
                                              description: A filter, or a nested group holding `operator` and `criteria` like the selection does
                                              additionalProperties: false
                                              properties:
                                                field:
                                                  type: string
                                                  example: family
                                                operator:
                                                  type: string
                                                  example: IN
                                                value:
                                                  description: The value the filter compares to, in the format its operator expects
                                                  example:
                                                  - tyres
                                                scope:
                                                  type:
                                                  - string
                                                  - 'null'
                                                locale:
                                                  type:
                                                  - string
                                                  - 'null'
                                                options:
                                                  type: object
                                                criteria:
                                                  type: array
                                                  items:
                                                    type: object
                                        example:
                                          operator: AND
                                          criteria:
                                          - field: family
                                            operator: IN
                                            value:
                                            - tyres
                                          - operator: OR
                                            criteria:
                                            - field: enabled
                                              operator: '='
                                              value: true
                                            - field: diameter
                                              operator: '='
                                              value: 17
                                              scope: null
                                              locale: null
                                      condition_groups:
                                        type: object
                                        description: 'The attribute comparisons a pair of products has to satisfy: all of them with `AND`, any of them with `OR`.

                                          No condition relates every base product to every compatible one. A single condition is read back under `AND`,

                                          whichever operator it was sent with. Sending the conditions means sending all of them. Conditions do not nest:

                                          every item of `conditions` is a condition, never another group.

                                          '
                                        additionalProperties: false
                                        required:
                                        - operator
                                        - conditions
                                        properties:
                                          operator:
                                            type: string
                                            enum:
                                            - AND
                                            - OR
                                            example: AND
                                          conditions:
                                            type: array
                                            maxItems: 100
                                            items:
                                              type: object
                                              additionalProperties: false
                                              required:
                                              - base_attribute
                                              - operator
                                              - compatible_attribute
                                              properties:
                                                base_attribute:
                                                  type: object
                                                  additionalProperties: false
                                                  required:
                                                  - attribute_code
                                                  properties:
                                                    attribute_code:
                                                      type: string
                                                      minLength: 1
                                                      example: diameter
                                                    scope:
                                                      type:
                                                      - string
                                                      - 'null'
                                                      minLength: 1
                                                      description: The channel of a scopable attribute, null otherwise
                                                      example: null
                                                    locale:
                                                      type:
                                                      - string
                                                      - 'null'
                                                      minLength: 1
                                                      description: The locale of a localizable attribute, null otherwise
                                                      example: null
                                                    record_attribute_code:
                                                      type:
                                                      - string
                                                      - 'null'
                                                      minLength: 1
                                                      description: 'When the attribute links to reference entity records, the code of the record attribute compared in place

                                                        of the records themselves. Null compares the records.

                                                        '
                                                      example: null
                                                operator:
                                                  type: string
                                                  enum:
                                                  - '='
                                                  - '>='
                                                  - <=
                                                  - matches_any
                                                  - contains
                                                  - matches_all
                                                  - matches_exactly
                                                  example: '='
                                                compatible_attribute:
                                                  type: object
                                                  additionalProperties: false
                                                  required:
                                                  - attribute_code
                                                  properties:
                                                    attribute_code:
                                                      type: string
                                                      minLength: 1
                                                      example: diameter
                                                    scope:
                                                      type:
                                                      - string
                                                      - 'null'
                                                      minLength: 1
                                                      description: The channel of a scopable attribute, null otherwise
                                                      example: null
                                                    locale:
                                                      type:
                                                      - string
                                                      - 'null'
                                                      minLength: 1
                                                      description: The locale of a localizable attribute, null otherwise
                                                      example: null
                                                    record_attribute_code:
                                                      type:
                                                      - string
                                                      - 'null'
                                                      minLength: 1
                                                      description: 'When the attribute links to reference entity records, the code of the record attribute compared in place

                                                        of the records themselves. Null compares the records.

                                                        '
                                                      example: null
                                        example:
                                          operator: AND
                                          conditions:
                                          - base_attribute:
                                              attribute_code: diameter
                                              scope: null
                                              locale: null
                                              record_attribute_code: null
                                            operator: '='
                                            compatible_attribute:
                                              attribute_code: rim_diameter
                                              scope: null
                                              locale: null
                                              record_attribute_code: null
                                    required:
                                    - enabled
                                    - base_product_selection
                                    - compatible_product_selection
                                    - condition_groups
                                  - type: 'null'
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/association-types?page=2&limit=3&with_count=true
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/association-types?page=1&limit=3&with_count=true
                  previous:
                    href: https://demo.akeneo.com/api/rest/v1/association-types?page=1&limit=3&with_count=true
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/association-types?page=3&limit=3&with_count=true
                current_page: 2
                items_count: 10
                _embedded:
                  items:
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/association-types/fits
                    code: fits
                    labels:
                      en_US: Fits
                      fr_FR: Compatible avec
                    is_quantified: false
                    is_two_way: true
                    rule:
                      enabled: true
                      base_product_selection:
                        operator: AND
                        criteria:
                        - field: family
                          operator: IN
                          value:
                          - tyres
                      compatible_product_selection:
                        operator: AND
                        criteria:
                        - field: family
                          operator: IN
                          value:
                          - rims
                      condition_groups:
                        operator: AND
                        conditions:
                        - base_attribute:
                            attribute_code: diameter
                            scope: null
                            locale: null
                            record_attribute_code: null
                          operator: '='
                          compatible_attribute:
                            attribute_code: rim_diameter
                            scope: null
                            locale: null
                            record_attribute_code: null
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/association-types/UPSELL
                    code: UPSELL
                    labels:
                      en_US: Upsell
                      fr_FR: Vente incitative
                    is_quantified: false
                    is_two_way: false
                    rule: null
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/association-types/X_SELL
                    code: X_SELL
                    labels:
                      en_US: Cross sell
                      fr_FR: Vente croisée
                    is_quantified: false
                    is_two_way: false
                    rule: null
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '406':
          description: 'This response indicates that the server cannot produce a response matching the list of acceptable values defined in the request''s `Accept` header.

            It is typically used when the requested resource is not available in the requested format.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 406
                message: xxx in `Accept` header is not valid. Only `application/json` is allowed.
        '422':
          description: 'This response indicates that the validation of the entity given in the body of the request failed.

            It occurs when the server understands the request but cannot process it due to validation errors in the provided data.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 422
                  message:
                    type: string
                    description: Message explaining the error
                    example: Validation failed.
                  errors:
                    type: array
                    description: A list of validation error messages (optional)
                    items:
                      type: object
                      properties:
                        property:
                          type: string
                          description: Name of the invalid property
                        message:
                          type: string
                          description: Human-readable error message
                        attribute:
                          type:
                          - string
                          - 'null'
                          description: Attribute code (if the error is on an attribute)
                        locale:
                          type:
                          - string
                          - 'null'
                          description: Locale code involved in the error, if any
                        scope:
                          type:
                          - string
                          - 'null'
                          description: Channel code involved in the error, if any
                    example:
                    - property: family
                      message: The tshirts family does not exist in your PIM.
                  _links:
                    type: object
                    properties:
                      documentation:
                        type: object
                        properties:
                          href:
                            type: string
                    example:
                      documentation:
                        href: http://api.akeneo.com/api-reference.html
              example:
                code: 422
                message: Validation failed.
                errors:
                - property: family
                  message: The tshirts family does not exist in your PIM.
                - property: categories
                  message: The "tvs_projectors" category does not exist.
                - property: associations.SUBSTITUTION.groups
                  message: You should associate existing groups. The "promotion" group does not exist.
                - property: values
                  message: The "description" attribute requires a channel.
                  attribute: description
                  locale: en_US
                  scope: null
                - property: values
                  message: The "name" attribute requires a locale.
                  attribute: name
                  locale: null
                  scope: null
                _links:
                  documentation:
                    href: http://api.akeneo.com/api-reference.html
    post:
      operationId: post_association_type
      x-visibility: public
      summary: Create a new association type
      description: This endpoint allows you to create a new association type
      tags:
      - Association type
      security:
      - bearerToken: []
      requestBody:
        description: Body containing the association type to create
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: Association type code
                  example: upsell
                labels:
                  type: object
                  description: Association type labels for each locale
                  default: {}
                  patternProperties:
                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                      description: Association type label for the locale
                      type:
                      - string
                      - 'null'
                      example: Upsell
                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                  example:
                    en_US: Upsell
                    fr_FR: Vente incitative
                is_quantified:
                  type: boolean
                  description: When true, the association is a quantified association
                  default: false
                  example: true
                is_two_way:
                  type: boolean
                  description: 'When true, the association is a bidirectional association. Created without it, a manual association type is

                    one-way and an automatic one is bidirectional

                    '
                  example: false
                rule:
                  description: 'How an automatic association type relates products, null for a manual one. A non-null rule creates an automatic

                    association type; a type never turns from manual to automatic or back.

                    A non-null rule is answered with a `422` while product compatibility is not enabled on the PIM

                    '
                  example: null
                  oneOf:
                  - type: object
                    description: How the compatibility relates products
                    properties:
                      enabled:
                        type: boolean
                        description: Whether the compatibility applies
                        example: true
                      base_product_selection:
                        type: object
                        description: 'Which products a side of the rule covers: the criteria they satisfy, all of them or any of them depending on

                          `operator`. A criterion is either a filter, `{"field": "family", "operator": "IN", "value": ["tyres"]}`, or a

                          nested group, `{"operator": "OR", "criteria": [...]}`, in the same filter format as `/products`.

                          `product_typology` restricts the selection to levels of the variant hierarchy, as

                          `{"field": "product_typology", "operator": "IN", "value": ["product-model", "product-variant"]}`, among

                          `product-model`, `sub-product-model`, `product-simple` and `product-variant`. It only takes the `IN`

                          operator and at least one level.

                          A filter on an attribute takes `scope` and `locale` too, `null` when the attribute is not scopable or not

                          localizable.

                          Groups nest at most 5 levels deep, the selection itself included, and a group holds at most 25 criteria.

                          No criterion means the selection covers every product of the catalog. Sending a selection means sending all

                          of it.

                          '
                        additionalProperties: false
                        required:
                        - operator
                        - criteria
                        properties:
                          operator:
                            type: string
                            enum:
                            - AND
                            - OR
                            example: AND
                          criteria:
                            type: array
                            maxItems: 25
                            items:
                              type: object
                              description: A filter, or a nested group holding `operator` and `criteria` like the selection does
                              additionalProperties: false
                              properties:
                                field:
                                  type: string
                                  example: family
                                operator:
                                  type: string
                                  example: IN
                                value:
                                  description: The value the filter compares to, in the format its operator expects
                                  example:
                                  - tyres
                                scope:
                                  type:
                                  - string
                                  - 'null'
                                locale:
                                  type:
                                  - string
                                  - 'null'
                                options:
                                  type: object
                                criteria:
                                  type: array
                                  items:
                                    type: object
                        example:
                          operator: AND
                          criteria:
                          - field: family
                            operator: IN
                            value:
                            - tyres
                          - operator: OR
                            criteria:
                            - field: enabled
                              operator: '='
                              value: true
                            - field: diameter
                              operator: '='
                              value: 17
                              scope: null
                              locale: null
                      compatible_product_selection:
                        type: object
                        description: 'Which products a side of the rule covers: the criteria they satisfy, all of them or any of them depending on

                          `operator`. A criterion is either a filter, `{"field": "family", "operator": "IN", "value": ["tyres"]}`, or a

                          nested group, `{"operator": "OR", "criteria": [...]}`, in the same filter format as `/products`.

                          `product_typology` restricts the selection to levels of the variant hierarchy, as

                          `{"field": "product_typology", "operator": "IN", "value": ["product-model", "product-variant"]}`, among

                          `product-model`, `sub-product-model`, `product-simple` and `product-variant`. It only takes the `IN`

                          operator and at least one level.

                          A filter on an attribute takes `scope` and `locale` too, `null` when the attribute is not scopable or not

                          localizable.

                          Groups nest at most 5 levels deep, the selection itself included, and a group holds at most 25 criteria.

                          No criterion means the selection covers every product of the catalog. Sending a selection means sending all

