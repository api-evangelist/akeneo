openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Reference entity record API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Reference entity record
  description: 'A reference entity record is a specific instance of a reference entity.

    It contains the values for the attributes defined in the reference entity.

    Reference entity records can be linked to products or product models, allowing you to associate additional information with them.'
paths:
  /api/rest/v1/reference-entities/records:
    get:
      operationId: get_all_reference_entity_records
      x-visibility: public
      summary: Get all records across all reference entities
      description: 'This endpoint allows you to get a list of records across all reference entities.

        Records are paginated and can be filtered.'
      tags:
      - Reference entity record
      security:
      - bearerToken: []
      parameters:
      - name: reference_entity
        in: query
        description: Filter records by a specific reference entity code
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: 'Filter records,

          for more details see the [Filters](https://api.akeneo.com/documentation/filter.html#filter-reference-entity-records)

          '
        required: false
        schema:
          type: string
        examples:
          getRecordsByRecordCode:
            summary: Filter the records by their code
            value: '{"code":[{"operator":"IN","value":["code1","code2"]}]}'
          getRecordsByCompleteness:
            summary: Filter the records to get only the completed ones on a given channel for given locales
            value: '{"complete":{"operator":"=","value":true,"channel":"ecommerce","locales":["en_US"]}}'
          getRecordsByUpdatedDate:
            summary: Filter the records by their update date
            value: '{"updated":[{"operator":">","value":"2018-07-04T10:00:00+00:00"}]}'
          getRecordsByTextAttributeValue:
            summary: Filter by a text attribute value
            value: '{"description":{"operator":"CONTAINS","value":"furniture","locale":"en_US","channel":"ecommerce"}}'
          getRecordsByNumberAttributeValue:
            summary: Filter by a number attribute value
            value: '{"creation_year":{"operator":">","value":"1950"}}'
          getRecordsByOptionAttributeValue:
            summary: Filter by an option (single or multiple)
            value: '{"nationality":{"operator":"IN","value":["french","italian"]}}'
          getRecordsByReferenceEntityLink:
            summary: Filter by a reference entity link (single or multiple)
            value: '{"designers":{"operator":"IN","value":["starck","dixon"]}}'
      - name: channel
        in: query
        description: 'Filter record values to return scopable record attributes for the given channel as well as the non localizable/non scopable record attributes,

          for more details see the [Filter record values by channel](https://api.akeneo.com/documentation/filter.html#record-values-by-channel) section.

          '
        required: false
        schema:
          type: string
        example: ecommerce
      - name: locales
        in: query
        description: 'Filter record values to return localizable record attributes for the given locales as well as the non localizable/non scopable record attributes,

          for more details see the [Filter record values by locale](https://api.akeneo.com/documentation/filter.html#record-values-by-locale) section.

          '
        required: false
        schema:
          type: string
        example: en_US,fr_FR
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      responses:
        '200':
          description: 'Return the records of the given reference entity paginated.

            The response is paginated and includes links to navigate through the pages.

            Only `search_after` pagination is use.

            '
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              required:
                              - code
                              properties:
                                code:
                                  type: string
                                  description: Code of the record
                                  example: kartell
                                values:
                                  type: object
                                  description: Record attribute values
                                  additionalProperties:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - data
                                      properties:
                                        locale:
                                          description: Locale code of the value
                                          type:
                                          - string
                                          - 'null'
                                        channel:
                                          description: Channel code of the value
                                          type:
                                          - string
                                          - 'null'
                                        data:
                                          description: 'Reference entity record value.

                                            See [the `data` format](https://api.akeneo.com/concepts/reference-entities.html#the-data-format) section for more details.

                                            '
                                          oneOf:
                                          - type: string
                                          - type: array
                                            items:
                                              type: string
                                          - type: object
                                          - type: 'null'
                                  x-validation-rules: Validation rules detailed in Reference entity record values section
                                  example:
                                    label:
                                    - locale: en_US
                                      channel: null
                                      data: Kartell
                                    image:
                                    - locale: null
                                      channel: null
                                      data: 0/c/b/0/0cb0c0e115dedba676f8d1ad8343ec207ab54c7b_image.jpg
                                    description:
                                    - locale: en_US
                                      channel: null
                                      data: Kartell, the Italian furniture company that sells modern and remarkable pieces of furniture.
                                    - locale: fr_FR
                                      channel: null
                                      data: Kartell, l'éditeur de meuble italien spécialisé dans la signature de belles pièces au design contemporain.
                                    country:
                                    - locale: null
                                      channel: null
                                      data: italy
                                    creation_year:
                                    - locale: null
                                      channel: null
                                      data: '1949'
                                created:
                                  type:
                                  - string
                                  - 'null'
                                  format: date-time
                                  readOnly: true
                                  example: '2021-01-01T01:23:34+00:00'
                                updated:
                                  type:
                                  - string
                                  - 'null'
                                  format: date-time
                                  readOnly: true
                                  example: '2021-02-03T23:45:59+00:00'
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records/kartell
                      example:
                        items:
                        - code: kartell
                          values:
                            label:
                            - locale: en_US
                              channel: null
                              data: Kartell
                          _links:
                            self:
                              href: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records/kartell
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records?search_after=ligneroset
                _embedded:
                  items:
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records/kartell
                    code: kartell
                    values:
                      label:
                      - locale: en_US
                        channel: null
                        data: Kartell
                      image:
                      - locale: null
                        channel: null
                        data: 0/c/b/0/0cb0c0e115dedba676f8d1ad8343ec207ab54c7b_image.jpg
                      description:
                      - locale: en_US
                        channel: null
                        data: The contemporary Italian furniture brand
                      - locale: fr_FR
                        channel: null
                        data: L'éditeur de meubles comtemporain italien
                      country:
                      - locale: null
                        channel: null
                        data: italy
                    created: '2021-01-01T01:23:34+00:00'
                    updated: '2021-02-03T23:45:59+00:00'
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records/usm
                    code: usm
                    values:
                      label:
                      - locale: en_US
                        channel: null
                        data: USM
                      image:
                      - locale: null
                        channel: null
                        data: 9/c/g/1/0cb0c0e115dedba76f8d1ad8343ec897abc43bv4_image.jpg
                      description:
                      - locale: en_US
                        channel: null
                        data: Modular furniture from Switzerland for your home and office
                      - locale: fr_FR
                        channel: null
                        data: L'éditeur de meubles modulaires suisse pour votre intérieur et pour les entreprises
                      country:
                      - locale: null
                        channel: null
                        data: switzerland
                    created: '2021-01-01T01:23:34+00:00'
                    updated: '2021-02-03T23:45:59+00:00'
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/reference-entities/brands/records/ligneroset
                    code: ligneroset
                    values:
                      label:
                      - locale: en_US
                        channel: null
                        data: Ligne Roset
                      image:
                      - locale: null
                        channel: null
                        data: 4/b/0/1/0cb0c0e115dedde78b8d1ad8343ec980cd5daa54_image.jpg
                      description:
                      - locale: en_US
