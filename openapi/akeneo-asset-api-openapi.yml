openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Asset API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Asset
  description: 'An asset is a flexible object that makes it possible to enrich products with images, videos, documents…

    An asset must be part of an asset family. That way, it will have its own attributes and lifecycle.

    Assets can be linked to products and product models, in order to enrich them.'
paths:
  /api/rest/v1/asset-families/{asset_family_code}/assets:
    get:
      operationId: get_assets
      x-visibility: public
      summary: Get the list of the assets of a given asset family
      description: 'This endpoint allows you to get a list of assets of a given asset family.

        Assets are paginated.

        This endpoint is case sensitive on the asset family code.'
      tags:
      - Asset
      security:
      - bearerToken: []
      parameters:
      - name: search
        in: query
        description: 'Filter assets,

          for more details see the [Asset filters](https://api.akeneo.com/documentation/filter.html#filter-assets) section.

          '
        required: false
        schema:
          type: string
        examples:
          getAssetsByAssetCode:
            summary: Filter the assets by their code
            value: '{"code":[{"operator":"IN","value":["code1","code2"]}]}'
          getAssetsByUpdatedDate:
            summary: Filter the assets by their update date
            value: '{"updated":[{"operator":">","value":"2018-07-04T10:00:00Z"}]}'
          getAssetsUpdatedOverPeriod:
            summary: Filter the assets that were updated over a period of time
            value: '{"updated":[{"operator":"NOT BETWEEN","value":["2018-07-04T10:00:00Z","2018-08-04T10:00:00Z"]}]}'
          getAssetsUpdatedSinceXDays:
            summary: Filter the assets that were updated since X days
            value: '{"updated":[{"operator":"SINCE LAST N DAYS","value":4}]}'
      - name: channel
        in: query
        description: 'Filter asset values to return scopable asset attributes for the given channel as well as the non localizable/non scopable asset attributes,

          for more details see the [Filter asset values by channel](https://api.akeneo.com/documentation/filter.html#asset-values-by-channel) section.

          '
        required: false
        schema:
          type: string
        example: ecommerce
      - name: locales
        in: query
        description: 'Filter asset values to return localizable asset attributes for the given locales as well as the non localizable/non scopable asset attributes,

          for more details see the [Filter asset values by locale](https://api.akeneo.com/documentation/filter.html#asset-values-by-locale) section.

          '
        required: false
        schema:
          type: string
        example: en_US,fr_FR
      - in: path
        name: asset_family_code
        description: 'This path parameter is used to specify the unique identifier of the asset family you want to retrieve or manipulate.

          It is essential for identifying the specific asset family in the API requests.

          Ensure that the asset family code is correctly formatted and corresponds to an existing asset family in the system.

          '
        required: true
        schema:
          type: string
        example: packshot
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      - in: query
        name: with_asset_auto_tags
        description: 'Return labels of asset tags generated by auto-tagging in the response.

          When set to `true`, the response will include human-readable labels for asset tags alongside their codes.

          If set to `false`, the response will only include tag codes, which can improve performance.

          See [the `linked_data` format](https://api.akeneo.com/concepts/asset-manager.html#the-linked_data-format) section for more details.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: attributes
        description: 'Comma-separated list of asset attribute codes. Only the values of these attributes are returned.

          It is useful for limiting the response to specific attributes and reducing its payload size.

          Attribute codes are case sensitive. An empty or malformed code, or a code that does not belong to the asset family, returns a 422 error.

          '
        required: false
        schema:
          type: string
        example: title,description
      responses:
        '200':
          description: 'Return the assets of the given asset family paginated.

            The response is paginated and includes links to navigate through the pages.

            Only `search_after` pagination is used.

            '
          content:
            application/json:
              schema:
                title: Asset
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/asset-families/packshot/assets/sku_54628_picture1
                            - type: object
                              required:
                              - code
                              properties:
                                code:
                                  type: string
                                  description: Code of the asset
                                  x-immutable: true
                                  example: sku_54628_picture1
                                asset_family_code:
                                  type: string
                                  description: Code of the asset family
                                  x-immutable: true
                                  example: packshot
                                values:
                                  type: object
                                  description: 'Asset attributes values.

                                    See the [Focus on the asset values](https://api.akeneo.com/concepts/asset-manager.html#focus-on-the-asset-values) section for more details.

                                    '
                                  patternProperties:
                                    ^\w+$:
                                      type: array
                                      items:
                                        type: object
                                        required:
                                        - locale
                                        - channel
                                        - data
                                        properties:
                                          channel:
                                            type:
                                            - string
                                            - 'null'
                                            description: Channel code of the asset attribute value
                                          locale:
                                            type:
                                            - string
                                            - 'null'
                                            description: Locale code of the asset attribute value
                                          data:
                                            oneOf:
                                            - type: string
                                            - type: array
                                              items:
                                                type: string
                                            - type: boolean
                                            - type: 'null'
                                            description: 'Asset attribute value.

                                              See [the `data` format](https://api.akeneo.com/concepts/asset-manager.html#the-data-format) section for more details.

                                              '
                                          linked_data:
                                            type: object
                                            description: 'Linked data for `media link`, `media file` and `auto tags` attribute values.

                                              See [the `linked_data` format](https://api.akeneo.com/concepts/asset-manager.html#the-linked_data-format) section for more details.

                                              '
                                          attribute_type:
                                            type: string
                                            description: The type of the value's attribute. See [type](https://api.akeneo.com/concepts/asset-manager.html#asset-attribute) section for more details.
                                            readOnly: true
                                            enum:
                                            - text
                                            - single_option
                                            - multiple_options
                                            - number
                                            - media_file
                                            - media_link
                                            - boolean
                                            - date
                                            - record
                                            - auto_tagging
                                            example: media_file
                                          _links:
                                            type: object
                                            description: 'Related links for the `media file` attribute values.

                                              See [the `_links` format](https://api.akeneo.com/concepts/asset-manager.html#the-_links-format) section for more details.

                                              '
                                            x-validation-rules: The share link is returned when asset sharing is enabled
                                  x-validation-rules: Validation rules detailed in Asset attribute values section
                                  example:
                                    media_file:
                                    - locale: en_US
                                      channel: ecommerce
                                      data: 0/0/9/d/009d38fe8c97e16f6b48bbf8f6cf8a9564401cc9_allie_jean_model_picture.png
                                      linked_data:
                                        original_filename: allie_jean_model_picture.png
                                        mime_type: image/jpeg
                                        size: 16070
                                        extension: jpg
                                        updated_at: 2026-04-22T07:39:37+0000
                                      _links:
                                        download:
                                          href: https://demo.akeneo.com/api/rest/v1/asset-media-files/0/0/9/d/009d38fe8c97e16f6b48bbf8f6cf8a9564401cc9_allie_jean_model_picture.png
                                        share_link:
                                          href: https://demo.asset.akeneo.com/model_pictures/media_file/allie_jean_model_picture.png
                                    description:
                                    - locale: en_US
                                      channel: ecommerce
                                      data: This is a product description
                                    main_colors:
                                    - locale: en_US
                                      channel: ecommerce
                                      data:
                                      - red
                                      - blue
                                created:
                                  type: string
                                  format: date-time
                                  description: Date of creation
                                  readOnly: true
                                  x-immutable: true
                                  example: '2021-05-31T09:23:34+00:00'
                                updated:
                                  type: string
                                  format: date-time
                                  description: Date of the last update
                                  readOnly: true
                                  example: '2021-05-31T09:23:34+00:00'
                  example:
