                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 404
                message: Resource `my_resource_code` does not exist.
  /api/rest/v1/data-model-designer/modelization-suggestions:
    get:
      operationId: get_data_model_designer_modelization_suggestions
      x-visibility: public
      summary: Get list of modelization suggestions
      description: 'Returns a paginated list of modelization suggestions.

        Users without the manage permission are automatically restricted to their own suggestions.'
      tags:
      - Data Architect Agent
      security:
      - bearerToken: []
      parameters:
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: codes
        required: false
        description: 'Filter suggestions by attribute codes present in their suggested attributes.

          Accepts a comma-separated list of attribute codes.

          Returns suggestions that contain at least one of the provided attribute codes.

          '
        schema:
          type: string
        example: color,size,weight
      - in: query
        name: status
        required: false
        description: 'Filter suggestions by status.

          '
        schema:
          type: string
          enum:
          - generating
          - draft
          - applied
          - declined
          - failed
        example: draft
      - in: query
        name: source
        required: false
        description: 'Filter suggestions by their source identifier.

          '
        schema:
          type: string
        example: my-system
      - in: query
        name: author
        required: false
        description: 'Filter suggestions by the author''s username.

          Only available for users with the manage permission. This parameter is ignored for users without it.

          '
        schema:
          type: string
        example: john.doe
      responses:
        '200':
          description: Returns a paginated list of modelization suggestions in HAL format
          content:
            application/json:
              schema:
                title: Modelization suggestions
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
