    patch:
      operationId: patch_attribute_options
      x-visibility: public
      summary: Update/create several attribute options
      description: This endpoint allows you to update and/or create several attribute options at once
      tags:
      - Attribute option
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: attribute_code
        description: 'This path parameter is used to specify the unique identifier of the attribute you want to retrieve or manipulate.

          It is essential for identifying the specific attribute in the API requests.

          Ensure that the attribute code is correctly formatted and corresponds to an existing attribute in the system.

          '
        required: true
        schema:
          type: string
        example: color
      x-body-by-line: Contains several lines, each line is an attribute option in JSON standard format
      requestBody:
        description: "Body containing the attribute options to update or create.\nEach line is a JSON representing an attribute option.\nEach object contains the following properties:\n  - `code`: Code of option (string) (mandatory)\n  - `attribute`: Code of attribute related to the attribute option (string) (not required, taken from the URL)\n  - `sort_order`: Order of attribute option (integer) (optional)\n  - `labels`: Attribute option labels for each locale (object) (optional)\n"
        content:
          application/vnd.akeneo.collection+json:
            schema:
              type: string
            x-body-by-line-schema:
              type: object
              properties:
                code:
                  type: string
                  description: Code of option
                  example: black
                attribute:
                  type: string
                  description: Code of attribute related to the attribute option
                  x-validation-rules: It is the same attribute code as the one given as path parameter
                  example: a_simple_select
                sort_order:
                  type: integer
                  description: Order of attribute option
                  x-validation-rules: It is a positive integer
                  example: 2
                labels:
                  type: object
                  description: Attribute option labels for each locale
                  default: {}
                  patternProperties:
                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                      description: Attribute option label for the specified locale
                      type:
                      - string
                      - 'null'
                      example: red
                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                  example:
                    en_US: Black
                    fr_FR: Noir
                    de_DE: Schwarz
            example: '{"code":"black","attribute":"a_simple_select","labels":{"en_US":"Black","fr_FR":"Noir"}}

              {"code":"red","label":{"en_US": "Red","fr_FR": "Rouge"}}

              {"code":"yellow","labels":{"en_US": "Yellow","fr_FR": "Jaune"}}

              '
      responses:
        '200':
          description: Returns a plain text response whose lines are JSON containing the status of each update or creation
          x-no-entity: true
          content:
            application/vnd.akeneo.collection+json:
              schema:
                type: string
              x-body-by-line-schema:
                type: object
                properties:
                  line:
                    type: integer
                    description: Line number
                    example: 10
                  code:
                    type: string
                    description: Resource code
                    example: my_code
                  status_code:
                    type: integer
                    description: HTTP status code, see [Client errors](https://api.akeneo.com/documentation/responses.html#client-errors) to understand the meaning of each code
                    example: 422
                  message:
                    type: string
                    description: Message explaining the error
                    example: Property "name" expects a string as data, "NULL" given. Check the API reference documentation.
              example: '{"line":1,"code":"black","status_code":201}

                {"line":2,"code":"red","status_code":422,"message":"Property \"label\" does not exist. Check the API format documentation."}

                {"line":3,"code":"yellow","status_code":204}

                '
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '413':
          description: 'This response indicates that the request entity is larger than the server is willing or able to process.

            It can occur when the number of resources in a batch request exceeds the maximum allowed limit.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 413
                message: Too many resources to process, 100 is the maximum allowed.
        '415':
          description: 'This response indicates that the `Content-type` header of the request is not supported by the server.

            The server expects the `Content-type` header to be `application/json`, and any other value will result in this error.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 415
                message: xxx in `Content-type` header is not valid.  Only `application/json` is allowed."
        '429':
          description: 'This response indicates that the user has sent too many requests in a given amount of time.

            It occurs when the rate limit for API requests has been exceeded, and the client should wait before making additional requests.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 429
                  message:
                    type: string
                    description: Message explaining the error
                    example: You have exceeded the limit of API requests per second.
              example:
                code: 429
                message: You have exceeded the limit of API requests per second.
  /api/rest/v1/attributes/{attribute_code}/options/{code}:
    get:
      operationId: get_attribute_option_by_code
      x-visibility: public
      summary: Get an attribute option
      description: This endpoint allows you to get the information about a given attribute option
      tags:
      - Attribute option
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: attribute_code
        description: 'This path parameter is used to specify the unique identifier of the attribute you want to retrieve or manipulate.

          It is essential for identifying the specific attribute in the API requests.

          Ensure that the attribute code is correctly formatted and corresponds to an existing attribute in the system.

          '
        required: true
        schema:
          type: string
        example: color
      - in: path
        name: code
        description: 'This path parameter is used to specify the unique identifier of the entity you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the code is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
        example: my_entity_code
      responses:
        '200':
          description: Returns the content of the attribute option in JSON standard format
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Code of option
                    example: black
                  attribute:
