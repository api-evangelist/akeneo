openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Attribute option API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Attribute option
  description: 'An attribute option is a value that can be associated with an attribute.

    For example, if you have an attribute called "Color", the options could be "Red", "Blue", "Green", etc.

    Options are used to provide predefined values for attributes, making it easier to manage and maintain product data.'
paths:
  /api/rest/v1/attributes/{attribute_code}/options:
    get:
      operationId: get_attribute_options
      x-visibility: public
      summary: Get list of attribute options
      description: 'This endpoint allows you to get a list of attribute options.

        Attribute options are paginated and sorted by code.'
      tags:
      - Attribute option
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: attribute_code
        description: 'This path parameter is used to specify the unique identifier of the attribute you want to retrieve or manipulate.

          It is essential for identifying the specific attribute in the API requests.

          Ensure that the attribute code is correctly formatted and corresponds to an existing attribute in the system.

          '
        required: true
        schema:
          type: string
        example: color
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: 'Return attribute options paginated.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Attribute Options
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 1
                    items_count:
                      type: integer
                      description: Total number of items (only if `with_count` parameter is set to true)
                      example: 5
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/attributes/color/options/red
                            - type: object
                              properties:
                                code:
                                  type: string
                                  description: Code of option
                                  example: black
                                attribute:
                                  type: string
                                  description: Code of attribute related to the attribute option
                                  x-validation-rules: It is the same attribute code as the one given as path parameter
                                  example: a_simple_select
                                sort_order:
                                  type: integer
                                  description: Order of attribute option
                                  x-validation-rules: It is a positive integer
                                  example: 2
                                labels:
                                  type: object
                                  description: Attribute option labels for each locale
                                  default: {}
                                  patternProperties:
                                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                                      description: Attribute option label for the specified locale
                                      type:
                                      - string
                                      - 'null'
                                      example: red
                                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                                  example:
                                    en_US: Black
                                    fr_FR: Noir
                                    de_DE: Schwarz
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/attributes/color/options?page=3&limit=3&with_count=true
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/attributes/color/options?page=1&limit=3&with_count=true
                  previous:
                    href: https://demo.akeneo.com/api/rest/v1/attributes/color/options?page=2&limit=3&with_count=true
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/attributes/color/options?page=4&limit=3&with_count=true
                current_page: 3
                items_count: 10
                _embedded:
                  items:
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/attributes/color/options/red
                    code: red
                    attribute: a_simple_select
                    sort_order: 1
                    labels:
                      en_US: Red
                      fr_FR: Rouge
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/attributes/color/options/black
                    code: black
                    attribute: a_simple_select
                    sort_order: 2
                    labels:
                      en_US: Black
                      fr_FR: Noir
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/attributes/color/options/purple
                    code: purple
                    attribute: a_simple_select
                    sort_order: 3
                    labels:
                      en_US: Purple
                      fr_FR: Violet
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '404':
          description: 'This response indicates that the requested resource could not be found on the server.

            It can occur when the resource code given in the URI does not correspond to any existing PIM resource.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 404
                message: Resource `my_resource_code` does not exist.
        '406':
          description: 'This response indicates that the server cannot produce a response matching the list of acceptable values defined in the request''s `Accept` header.

            It is typically used when the requested resource is not available in the requested format.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 406
                message: xxx in `Accept` header is not valid. Only `application/json` is allowed.
        '422':
          description: 'This response indicates that the validation of the entity given in the body of the request failed.

            It occurs when the server understands the request but cannot process it due to validation errors in the provided data.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 422
                  message:
                    type: string
                    description: Message explaining the error
                    example: Validation failed.
                  errors:
                    type: array
                    description: A list of validation error messages (optional)
                    items:
                      type: object
                      properties:
                        property:
                          type: string
                          description: Name of the invalid property
                        message:
                          type: string
                          description: Human-readable error message
                        attribute:
                          type:
                          - string
                          - 'null'
                          description: Attribute code (if the error is on an attribute)
                        locale:
                          type:
                          - string
                          - 'null'
                          description: Locale code involved in the error, if any
                        scope:
                          type:
                          - string
                          - 'null'
                          description: Channel code involved in the error, if any
                    example:
                    - property: family
                      message: The tshirts family does not exist in your PIM.
                  _links:
                    type: object
                    properties:
                      documentation:
                        type: object
                        properties:
                          href:
                            type: string
                    example:
                      documentation:
                        href: http://api.akeneo.com/api-reference.html
              example:
                code: 422
                message: Validation failed.
                errors:
                - property: family
                  message: The tshirts family does not exist in your PIM.
                - property: categories
                  message: The "tvs_projectors" category does not exist.
                - property: associations.SUBSTITUTION.groups
                  message: You should associate existing groups. The "promotion" group does not exist.
                - property: values
                  message: The "description" attribute requires a channel.
                  attribute: description
                  locale: en_US
                  scope: null
                - property: values
                  message: The "name" attribute requires a locale.
                  attribute: name
                  locale: null
                  scope: null
                _links:
                  documentation:
                    href: http://api.akeneo.com/api-reference.html
    post:
      operationId: post_attribute_option
      x-visibility: public
      summary: Create a new attribute option
      description: This endpoint allows you to create a new attribute option
      tags:
      - Attribute option
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: attribute_code
        description: 'This path parameter is used to specify the unique identifier of the attribute you want to retrieve or manipulate.

          It is essential for identifying the specific attribute in the API requests.

          Ensure that the attribute code is correctly formatted and corresponds to an existing attribute in the system.

          '
        required: true
        schema:
          type: string
        example: color
      requestBody:
        description: Body containing the attribute option to create
        content:
          application/json:
            schema:
              required:
              - code
              type: object
              properties:
                code:
                  type: string
                  description: Code of option
                  example: black
                attribute:
                  type: string
                  description: Code of attribute related to the attribute option
                  x-validation-rules: It is the same attribute code as the one given as path parameter
                  example: a_simple_select
                sort_order:
                  type: integer
                  description: Order of attribute option
                  x-validation-rules: It is a positive integer
                  example: 2
                labels:
                  type: object
                  description: Attribute option labels for each locale
                  default: {}
                  patternProperties:
                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                      description: Attribute option label for the specified locale
                      type:
                      - string
                      - 'null'
                      example: red
                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                  example:
                    en_US: Black
                    fr_FR: Noir
                    de_DE: Schwarz
            example:
              code: black
              attribute: a_simple_select
              sort_order: 2
              labels:
                en_US: Black
                fr_FR: Noir
      responses:
        '201':
          description: 'This response indicates that the entity was successfully created.

            The server has fulfilled the request and created a new resource.

            The response includes a `Location` header that contains the URI of the newly created resource.

            '
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
        '400':
          description: 'This response indicates that the server cannot process the request due to a client error, such as malformed request syntax, invalid request message framing, or deceptive request routing.

            It is typically used when the server cannot understand the request due to invalid JSON or other client-side issues.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 400
                message: Invalid JSON message received
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
