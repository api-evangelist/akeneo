openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Workflows API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Workflows
  description: The Workflows endpoints allow you to retrieve the configuration of the Workflows and Steps.
paths:
  /api/rest/v1/workflows:
    get:
      operationId: get_workflows_list
      x-visibility: public
      summary: Get list of workflows
      description: Retrieves a paginated list of workflows
      tags:
      - Workflows
      security:
      - bearerToken: []
      parameters:
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100
        example: 100
      responses:
        '200':
          description: 'Paginated list of workflows.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Workflows
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 1
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            type: object
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/workflows/6f37476a-04c2-46c0-b6d0-e18316959068
                            - type: object
                              properties:
                                uuid:
                                  type: string
                                  format: uuid
                                  description: Workflow UUID
                                  example: 6f37476a-04c2-46c0-b6d0-e18316959068
                                code:
                                  type: string
                                  description: Workflow code
                                  example: enrichment_workflow
                                labels:
                                  type: object
                                  description: Workflow labels per locale
                                  default: {}
                                  patternProperties:
                                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                                      type:
                                      - string
                                      - 'null'
                                      description: Label for locale
                                      example: Enrichment workflow
                                  example:
                                    en_US: Enrichment workflow
                                    fr_FR: Workflow d'enrichissement
                                enabled:
                                  type: boolean
                                  description: Whether the workflow is enabled
                                  example: true
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/workflows?page=1
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/workflows?page=1
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/workflows?page=2
                current_page: 1
                _embedded:
                  items:
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/workflows/6f37476a-04c2-46c0-b6d0-e18316959068
                    uuid: 6f37476a-04c2-46c0-b6d0-e18316959068
                    code: enrichment_workflow
                    enabled: true
                    labels:
                      en_US: Enrichment workflow
                      fr_FR: Workflow d'enrichissement
                  - _links:
                      self:
                        href: https://demo.akeneo.com/api/rest/v1/workflows/a1b2c3d4-e5f6-7890-1234-567890abcdef
                    uuid: a1b2c3d4-e5f6-7890-1234-567890abcdef
                    code: translation_workflow
                    enabled: false
                    labels:
                      en_US: Translation workflow
                      fr_FR: Workflow de traduction
        '400':
          description: 'This response indicates that the server cannot process the request due to a client error, such as malformed request syntax, invalid request message framing, or deceptive request routing.

            It is typically used when the server cannot understand the request due to invalid JSON or other client-side issues.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 400
                message: Invalid JSON message received
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '415':
          description: 'This response indicates that the `Content-type` header of the request is not supported by the server.

            The server expects the `Content-type` header to be `application/json`, and any other value will result in this error.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 415
                message: xxx in `Content-type` header is not valid.  Only `application/json` is allowed."
  /api/rest/v1/workflows/{uuid}:
    get:
      operationId: get_workflow_by_uuid
      x-visibility: public
      summary: Get a workflow
      description: This endpoint allows you to get the information about a given workflow as well as its steps
      tags:
      - Workflows
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: uuid
        description: 'This path parameter is used to specify the unique identifier of the entity you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the UUID is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Returns the content of the workflow in JSON standard format
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                    description: Workflow UUID
                    example: 6f37476a-04c2-46c0-b6d0-e18316959068
                  code:
                    type: string
                    description: Workflow code
                    example: enrichment_workflow
                  labels:
                    type: object
                    description: Locale code
                    default: {}
                    patternProperties:
                      ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                        type:
                        - string
                        - 'null'
                        description: Workflow labels per locale
                        example: Workflow d'enrichissement
                    example:
                      fr_FR: Workflow d'enrichissement
                  enabled:
                    type: boolean
                    description: Whether the workflow is enabled
                    example: true
                  steps:
                    type: array
                    description: List of workflow steps
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          format: uuid
                          description: Step UUID
                          example: f626d0e5-84a5-41fc-8215-65508c253edb
                        code:
                          type: string
                          description: Step code
                          example: marketing_enrichment
                        type:
                          type: string
                          description: Step type (e.g. enrichment, review)
                          example: enrichment
                        labels:
                          type: object
                          description: Locale code
                          default: {}
                          patternProperties:
                            ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                              type:
                              - string
                              - 'null'
                              description: Step labels per locale
                              example: Marketing enrichment
                          example:
                            en_US: Marketing enrichment
                            fr_FR: Enrichissement marketing
                        descriptions:
                          type: object
                          description: Locale code
                          default: {}
                          patternProperties:
                            ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                              type:
                              - string
                              - 'null'
                              description: Step descriptions per locale
                              example: Enrich marketing attributes
                          example:
                            fr_FR: Enrich marketing attributes
                        allotted_time:
                          type:
                          - object
                          - 'null'
                          description: 'Allotted time for the step (e.g. `{"value": 1, "unit": "days"}` or nullable)'
                          properties:
                            value:
                              type: integer
                              description: Amount of time
                              example: 1
                            unit:
                              type: string
                              description: Time unit (days)
                              example: days
                          example:
                            value: 3
                            unit: days
                        channels_and_locales:
                          type: object
                          description: Step configuration for channels and locales
                          additionalProperties:
                            type: array
                            items:
                              type: string
                              description: Locale code
                          example:
                            ecommerce:
                            - en_US
                            mobile:
                            - en_US
                            - fr_FR
                    example:
                    - uuid: f626d0e5-84a5-41fc-8215-65508c253edb
                      code: marketing_enrichment
                      type: enrichment
                      labels:
                        en_US: Marketing enrichment
                        fr_FR: Enrichissement marketing
                      descriptions:
                        en_US: Enrich marketing attributes
                      allotted_time:
                        value: 3
                        unit: days
                      channels_and_locales:
                        ecommerce:
                        - en_US
                        mobile:
                        - en_US
                        - fr_FR
                    - uuid: b2c1f3d4-5e6a-4c8b-9f0e-2d3e4f5a6b7c
                      code: marketing_review
                      type: review
                      labels: {}
                      descriptions: {}
                      allotted_time: null
                      channels_and_locales:
                        ecommerce:
                        - en_US
              example:
                uuid: 6f37476a-04c2-46c0-b6d0-e18316959068
                code: enrichment_workflow
                labels:
                  en_US: Enrichment workflow
                  fr_FR: Workflow d'enrichissement
                enabled: true
                steps:
                - uuid: f626d0e5-84a5-41fc-8215-65508c253edb
                  code: marketing_enrichment
                  type: enrichment
                  labels:
                    en_US: Marketing enrichment
                    fr_FR: Enrichissement marketing
                  descriptions:
                    en_US: Enrich marketing attributes
                  allotted_time:
                    value: 3
                    unit: days
                  channels_and_locales:
                    ecommerce:
                    - en_US
                    mobile:
                    - en_US
                    - fr_FR
                - uuid: b2c1f3d4-5e6a-4c8b-9f0e-2d3e4f5a6b7c
                  code: marketing_review
                  type: review
                  labels: {}
                  descriptions: {}
                  allotted_time: null
                  channels_and_locales:
                    ecommerce:
                    - en_US
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '404':
          description: 'This response indicates that the requested resource could not be found on the server.

            It can occur when the resource code given in the URI does not correspond to any existing PIM resource.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 404
                message: Resource `my_resource_code` does not exist.
        '406':
          description: 'This response indicates that the server cannot produce a response matching the list of acceptable values defined in the request''s `Accept` header.

            It is typically used when the requested resource is not available in the requested format.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 406
                message: xxx in `Accept` header is not valid. Only `application/json` is allowed.
  /api/rest/v1/workflows/steps/{uuid}/assignees:
    get:
      operationId: get_workflow_step_assignees
      x-visibility: public
      summary: Get list of workflow step assignees
      description: Retrieves a paginated list of assignees for a specified workflow step
      tags:
      - Workflows
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: uuid
        description: 'This path parameter is used to specify the unique identifier of the entity you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the UUID is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100
        example: 100
      responses:
        '200':
          description: 'Paginated list of assignees for a specified workflow step.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                properties:
                  current_page:
                    type: integer
                    description: Current page number
                    example: 1
                  _embedded:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              description: Assignee UUID
                              format: uuid
                              example: 25566245-55c3-42ce-86d9-8610ac459fa8
                            first_name:
                              type: string
                              description: Assignee first name
                              example: John
                            last_name:
                              type: string
                              description: Assignee last name
                              example: Doe
                            email:
                              type: string
                              description: Assignee email address
                              example: john@example.com
                    example:
                      items:
                      - uuid: 25566245-55c3-42ce-86d9-8610ac459fa8
                        first_name: John
                        last_name: Doe
                        email: john@example.com
              example:
                _links:
                  self:
                    href: https://demo.akeneo.com/api/rest/v1/workflows/steps/f626d0e5-84a5-41fc-8215-65508c253edb/assignees?page=1&limit=10
                  first:
                    href: https://demo.akeneo.com/api/rest/v1/workflows/steps/f626d0e5-84a5-41fc-8215-65508c253edb/assignees?page=1&limit=10
                  next:
                    href: https://demo.akeneo.com/api/rest/v1/workflows/steps/f626d0e5-84a5-41fc-8215-65508c253edb/assignees?page=2&limit=10
                current_page: 1
                _embedded:
                  items:
                  - uuid: 25566245-55c3-42ce-86d9-8610ac459fa8
                    first_name: John
                    last_name: Doe
                    email: john@example.com
                  - uuid: be6354b0-4545-4aaa-882d-aa14be68642c
                    first_name: Julia
                    last_name: Stark
                    email: julia@example.com
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '404':
          description: 'This response indicates that the requested resource could not be found on the server.

            It can occur when the resource code given in the URI does not correspond to any existing PIM resource.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 404
                message: Resource `my_resource_code` does not exist.
        '406':
          description: 'This response indicates that the server cannot produce a response matching the list of acceptable values defined in the request''s `Accept` header.

            It is typically used when the requested resource is not available in the requested format.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 406
                message: xxx in `Accept` header is not valid. Only `application/json` is allowed.
        '422':
          description: 'This response indicates that the validation of the entity given in the body of the request failed.

            It occurs when the server understands the request but cannot process it due to validation errors in the provided data.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 422
                  message:
                    type: string
                    description: Message explaining the error
                    example: Validation failed.
                  errors:
                    type: array
                    description: A list of validation error messages (optional)
                    items:
                      type: object
                      properties:
                        property:
                          type: string
                          description: Name of the invalid property
                        message:
                          type: string
                          description: Human-readable error message
                        attribute:
                          type:
                          - string
                          - 'null'
                          description: Attribute code (if the error is on an attribute)
                        locale:
                          type:
                          - string
                          - 'null'
                          description: Locale code involved in the error, if any
                        scope:
                          type:
                          - string
                          - 'null'
                          description: Channel code involved in the error, if any
                    example:
                    - property: family
                      message: The tshirts family does not exist in your PIM.
                  _links:
                    type: object
                    properties:
                      documentation:
                        type: object
                        properties:
                          href:
                            type: string
                    example:
                      documentation:
                        href: http://api.akeneo.com/api-reference.html
              example:
                code: 422
                message: Validation failed.
                errors:
                - property: family
                  message: The tshirts family does not exist in your PIM.
                - property: categories
                  message: The "tvs_projectors" category does not exist.
                - property: associations.SUBSTITUTION.groups
                  message: You should associate existing groups. The "promotion" group does not exist.
                - property: values
                  message: The "description" attribute requires a channel.
                  attribute: description
                  locale: en_US
                  scope: null
                - property: values
                  message: The "name" attribute requires a locale.
                  attribute: name
                  locale: null
                  scope: null
                _links:
                  documentation:
                    href: http://api.akeneo.com/api-reference.html
components:
  securitySchemes:
    basicToken:
      scheme: basic
      type: http
      description: 'HTTP Basic authentication using user credentials.

        [More information here](https://api.akeneo.com/documentation/authentication.html)

        '
    bearerToken:
      scheme: bearer
      type: http
      description: 'Bearer token obtained via the "Password Grant" flow.

