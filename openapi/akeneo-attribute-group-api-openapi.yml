    patch:
      operationId: patch_attribute_groups
      x-visibility: public
      summary: Update/create several attribute groups
      description: This endpoint allows you to update and/or create several attribute groups at once
      tags:
      - Attribute group
      security:
      - bearerToken: []
      x-body-by-line: Contains several lines, each line is an attribute group in JSON standard format
      requestBody:
        description: "Body containing the attribute groups to update or create.\nEach line is a JSON object representing an attribute group.\nEach object contains the following properties:\n  - `code`: Attribute group code (string) (mandatory)\n  - `sort_order`: Attribute group order among other attribute groups (integer) (optional)\n  - `attributes`: Attribute codes that compose the attribute group (array of strings) (optional)\n  - `labels`: Attribute group labels for each locale (object) (optional)\n"
        content:
          application/vnd.akeneo.collection+json:
            schema:
              type: string
            x-body-by-line-schema:
              type: object
              properties:
                code:
                  type: string
                  description: Attribute group code
                  x-immutable: true
                  example: marketing
                sort_order:
                  type: integer
                  description: Attribute group order among other attribute groups
                  default: 0
                  x-validation-rules: It is a positive integer
                  example: 2
                attributes:
                  type: array
                  description: Attribute codes that compose the attribute group
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is an existing attribute code, an attribute can only be in one attribute group
                  example:
                  - sku
                  - name
                  - description
                labels:
                  type: object
                  description: Attribute group labels for each locale
                  default: {}
                  patternProperties:
                    ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                      description: Attribute group label for the locale
                      type:
                      - string
                      - 'null'
                      example: Marketing
                  x-validation-rules: The `localeCode` is the code of an existing and activated locale
                  example:
                    en_US: Marketing
                    fr_FR: Marketing
            example: '{"code":"technical","labels":{"en_US": "Technical", "fr_FR": "Technique"}}

              {"code":"marketing","type":"bar"}

              {"code":"design","sort_order":7}

              '
      responses:
        '200':
          description: Returns a plain text response whose lines are JSON containing the status of each update or creation
          content:
            application/vnd.akeneo.collection+json:
              schema:
                type: string
                description: 'Each line is a JSON object containing the status of the update or creation of an attribute group,

                  with the `line` property indicating the line number in the request body

                  '
              x-body-by-line-schema:
                type: object
                properties:
                  line:
                    type: integer
                    description: Line number
                    example: 10
                  code:
                    type: string
                    description: Resource code
                    example: my_code
                  status_code:
                    type: integer
                    description: HTTP status code, see [Client errors](https://api.akeneo.com/documentation/responses.html#client-errors) to understand the meaning of each code
                    example: 422
                  message:
                    type: string
                    description: Message explaining the error
                    example: Property "name" expects a string as data, "NULL" given. Check the API reference documentation.
              example: '{"line":1,"code":"technical","status_code":201}

                {"line":2,"code":"marketing","status_code":422,"message":"Property \"type\" does not exist. Check the standard format documentation.","_links":{"documentation":{"href":"http:\/\/api.akeneo.com\/api-reference.html#patch_attribute_groups__code_"}}}

                {"line":3,"code":"design","status_code":204}

                '
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 401
                message: Full authentication is required to access this resource.
        '403':
          description: 'This response indicates that the request is not authorized. This can occur when the user lacks the necessary permissions to access a resource or perform an action, or when the request payload is too large for the platform to process.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 403
                message: Access forbidden. You are not allowed to list this entity.
        '413':
          description: 'This response indicates that the request entity is larger than the server is willing or able to process.

            It can occur when the number of resources in a batch request exceeds the maximum allowed limit.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 413
                message: Too many resources to process, 100 is the maximum allowed.
        '415':
          description: 'This response indicates that the `Content-type` header of the request is not supported by the server.

            The server expects the `Content-type` header to be `application/json`, and any other value will result in this error.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
                  message:
                    type: string
                    description: Message explaining the error
                    example: Full authentication is required to access this resource.
              example:
                code: 415
                message: xxx in `Content-type` header is not valid.  Only `application/json` is allowed."
  /api/rest/v1/attribute-groups/{code}:
    get:
      operationId: get_attribute_group_by_code
      x-visibility: public
      summary: Get an attribute group
      description: This endpoint allows you to get the information about a given attribute group
      tags:
      - Attribute group
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: code
        description: 'This path parameter is used to specify the unique identifier of the entity you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the code is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
        example: my_entity_code
      responses:
        '200':
          description: Returns the content of the attribute group in JSON standard format
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                properties:
                  code:
                    type: string
                    description: Attribute group code
                    x-immutable: true
                    example: marketing
                  sort_order:
                    type: integer
                    description: Attribute group order among other attribute groups
                    default: 0
                    x-validation-rules: It is a positive integer
                    example: 2
                  attributes:
                    type: array
                    description: Attribute codes that compose the attribute group
                    items:
                      type: string
                    default: []
                    x-validation-rules: Each string of the array is an existing attribute code, an attribute can only be in one attribute group
                    example:
                    - sku
                    - name
                    - description
                  labels:
                    type: object
                    description: Attribute group labels for each locale
                    default: {}
                    patternProperties:
                      ^[a-zA-Z]{2,}_[a-zA-Z0-9_]{2,}$:
                        description: Attribute group label for the locale
                        type:
                        - string
                        - 'null'
                        example: Marketing
                    x-validation-rules: The `localeCode` is the code of an existing and activated locale
                    example:
                      en_US: Marketing
                      fr_FR: Marketing
              example:
                code: marketing
                sort_order: 4
                attributes:
                - sku
                - name
                - description
                - response_time
                - release_date
                - price
                labels:
                  en_US: Marketing
                  fr_FR: Marketing
        '401':
          description: 'This response indicates that authentication is required to access the requested resource.

            It can be caused by a missing or expired token, or if the provided credentials are invalid.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP status code
                    example: 401
