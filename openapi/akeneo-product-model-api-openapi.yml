openapi: 3.2.0
info:
  title: Akeneo API REFERENCE Product model API
  version: 1.0.0
  description: 'This is the reference documentation for the Akeneo PIM REST API.

    It provides detailed information about the available endpoints, request and response formats, and authentication methods.


    For more information, visit the Akeneo PIM documentation.'
  license:
    name: Open Software License 3.0
    url: http://opensource.org/licenses/OSL-3.0
  contact:
    name: Akeneo Support
    url: https://www.akeneo.com/support-help-center/
    email: contact@akeneo.com
servers:
- url: '{your-pim-url}'
  variables:
    your-pim-url:
      default: ''
      description: 'Set the PIM url you want to target ex: https://my-pim.cloud.akeneo.com or https://localhost:8443'
tags:
- name: Product model
  description: 'A product model is a template for products that share the same attributes and values.

    It allows you to create a hierarchy of products, where a product model can have several variants.

    A product model can also have its own attributes and values, which are inherited by its variants.'
paths:
  /api/rest/v1/product-models:
    get:
      operationId: get_product_models
      x-visibility: public
      summary: Get list of product models
      description: 'This endpoint allows you to get a list of product models.

        Product models are paginated.

        Permissions based on your user groups are applied to the set of products you request.'
      tags:
      - Product model
      security:
      - bearerToken: []
      parameters:
      - name: search
        in: query
        description: 'Filter product models,

          for more details see the [Filters](https://api.akeneo.com/documentation/filter.html).

          '
        required: false
        schema:
          type: string
        examples:
          getProductModelsByCategory:
            summary: Filter the product models by their category
            value: '{"categories":[{"operator":"IN","value":["winter_collection"]}]}'
          getProductModelsByCompleteness:
            summary: Filter the product models by their completeness
            value: '{"completeness":[{"operator":"ALL COMPLETE","locale":"fr_FR","scope":"ecommerce"}]}'
          getProductModelsWithOneVariantComplete:
            summary: Filter the product models that have at least one variant product 100% complete
            value: '{"completeness":[{"operator":"AT LEAST COMPLETE","locales":["en_US","fr_FR"],"scope":"ecommerce"}]}'
          getProductModelsByFamily:
            summary: Filter the product models that are in the camcorders family,
            value: '{"family":[{"operator":"IN","value":["camcorders"]}]}'
          getProductModelsNotInFamily:
            summary: Filter the product models that are not in the camcorders and digital_cameras family
            value: '{"family":[{"operator":"NOT IN","value":["camcorders","digital_cameras"]}]}'
          getProductModelsByCreationDate:
            summary: Filter the product models by their creation date
            value: '{"created":[{"operator":"=","value":"2016-07-04 10:00:00"}]}'
          getProductModelsUpdatedSinceXDays:
            summary: Filter the product models updated since X days
            value: '{"updated":[{"operator":"SINCE LAST N DAYS","value":4}]}'
          getProductModelsUpdatedIncludingLinkedEntities:
            summary: Filter the product models by their update date including linked entity changes
            value: '{"updated_including_linked_entities":[{"operator":">","value":"2025-01-01 00:00:00"}]}'
          getProductModelsUpdatedIncludingLinkedEntitiesSinceLastNDays:
            summary: Filter the product models updated (including linked entity changes) since N days
            value: '{"updated_including_linked_entities":[{"operator":"SINCE LAST N DAYS","value":7}]}'
          getProductModelsUpdatedIncludingLinkedEntitiesWithSpecificTypes:
            summary: Filter the product models by update date including only specific linked entity types
            value: '{"updated_including_linked_entities":[{"operator":">","value":"2025-01-01 00:00:00"}],"updated_including_linked_type":[{"operator":"IN","value":["asset","reference_entity_record"]}]}'
          getProductModelsUpdatedIncludingLinkedEntitiesAssetsOnly:
            summary: Filter the product models by update date including only asset changes
            value: '{"updated_including_linked_entities":[{"operator":"SINCE LAST N DAYS","value":7}],"updated_including_linked_type":[{"operator":"IN","value":["asset"]}]}'
          getVariantProductsByRootProductModelCode:
            summary: Filter the sub-product models of the root product model with the code tshirt_armor
            value: '{"parent":[{"operator":"IN","value":["tshirt_armor"]}]}'
          getAllRootProductModels:
            summary: Filter the root product models (product models without parent)
            value: '{"parent":[{"operator":"IS NULL"}]}'
          getAllSubProductModels:
            summary: Filter the sub-product models (product models with parent)
            value: '{"parent":[{"operator":"IS NOT NULL"}]}'
          getProductModelsByReadinessAt100PercentOnAGivenChannelAndLocale:
            summary: Filter the product models by their readiness score for a given readiness configuration and channel/locale
            value: '{"readiness":[{"operator":"=","value":100,"readiness_code":"camcorders_ecommerce","scope":"ecommerce","locale":"en_US"}]}'
          getProductModelsByReadinessGreaterThan50PercentOnGivenLocales:
            summary: Filter the product models by their readiness score for a given readiness configuration, channel and list of locales
            value: '{"readiness":[{"operator":"GREATER THAN ON ALL LOCALES","value":50,"readiness_code":"camcorders_ecommerce","scope":"ecommerce","locales":["en_US","fr_FR"]}]}'
      - in: query
        name: scope
        description: 'Filter product values to return scopable attributes for the given channel as well as the non localizable/non scopable attributes.

          It is useful for retrieving product information specific to a particular sales channel, which is essential for channel-specific applications.

          For more details see the [Filter product values via channel](https://api.akeneo.com/documentation/filter.html#via-channel) section.

          '
        required: false
        schema:
          type: string
        example: ecommerce
      - in: query
        name: locales
        description: 'Filter product values to return localizable attributes for the given locales as well as the non localizable/non scopable attributes.

          It is useful for retrieving product information in specific languages, which is essential for multi-locale applications.

          For more details see the [Filter product values via locale](https://api.akeneo.com/documentation/filter.html#via-locale) section.

          '
        required: false
        schema:
          type: string
        example: en_US,fr_FR
      - in: query
        name: attributes
        description: 'Filter product values to only return those concerning the given attributes.

          It is useful for limiting the response to specific attributes, reducing payload size and improving performance.

          For more details see the [Filter product values via attributes](https://api.akeneo.com/documentation/filter.html#via-attributes) section.

          '
        required: false
        schema:
          type: string
        example: name,description
      - in: query
        name: pagination_type
        description: 'Specify which pagination method to use for navigating through large datasets.

          It is useful for choosing between different pagination strategies based on your specific use case and performance requirements.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          enum:
          - page
          - search_after
          default: page
        example: page
      - in: query
        name: page
        description: 'Specify which page of results to retrieve when using pagination.

          It is useful for navigating through large datasets by breaking them into smaller, manageable pages.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - in: query
        name: search_after
        description: 'Cursor when using the `search_after` pagination method type.

          It is essential for navigating through pages in cursor-based pagination, providing more efficient pagination for large datasets.

          Should never be set manually, see [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: string
          default: cursor to the first page
        example: qaXbcde
      - in: query
        name: limit
        description: 'Specify the maximum number of results to return per page.

          It is useful for controlling the amount of data returned in a single request, especially when dealing with large datasets.

          See [Pagination](https://api.akeneo.com/documentation/pagination.html) section for more details.

          '
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        example: 100
      - in: query
        name: search_scope
        description: 'Filter scopes based on specific criteria.

          If you need to filter on several attributes on the same scope, you can use this parameter, to avoid repeating yourself for each attribute.

          For more details see the [Filters](https://api.akeneo.com/documentation/filter.html#search_scope-query-parameter) section.

          '
        required: false
        schema:
          type: string
        example: ecommerce
      - in: query
        name: search_locale
        description: 'Filter locales based on specific criteria.

          If you need to filter on several attributes on the same locale, you can use this parameter, to avoid repeating yourself for each attribute.

          For more details see the [Filters](https://api.akeneo.com/documentation/filter.html#search_locale-query-parameter) section.

          '
        required: false
        schema:
          type: string
        example: en_US
      - in: query
        name: convert_measurements
        description: 'Convert measurement attribute values to the appropriate unit for the channel provided by the `scope` parameter.


          When set to `true`, the `scope` parameter is required.

          '
        schema:
          type: boolean
          default: false
        required: false
        example: true
      - in: query
        name: with_count
        description: 'Return the count of items in the response.

          Be careful with that, on a big catalog, it can decrease performance in a significant way.

          It is useful for understanding the size of the dataset being returned, especially when dealing with large collections.

          Use it judiciously to avoid performance issues.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_workflow_execution_statuses
        description: 'Return an array of workflow_execution_statuses directly associated with the requested entity (product or product model) in the response.

          Statuses are level-specific and are not inherited from parent models. For a complete overview of a variant product, you must query the variant itself and its parent model(s) in separate requests.

          Each workflow object contains:

          - The overall execution status (e.g., in_progress, completed).

          - A list of all associated tasks.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: with_attribute_options
        in: query
        description: 'Return labels of attribute options in the response.

          See [the `linked_data` format](https://api.akeneo.com/concepts/products.html#the-linked_data-format) section for more details.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_asset_share_links
        description: 'Return asset collection share link URLs in the response.

          When set to `true`, the response will include direct URLs to asset collections for sharing purposes.

          This is useful for accessing direct links to asset collections, which can be used for sharing or external integrations.

          If set to `false`, the response will not include share links, which can improve performance.

          See [the `linked_data` format](https://api.akeneo.com/concepts/products.html#the-linked_data-format) for more details.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - in: query
        name: with_enabled_assets_only
        description: 'When set to `true`, disabled assets are excluded from asset collection values in the response.

          Only assets with `status: "enabled"` are returned.

          When set to `false` (default), all assets are returned regardless of their status.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: with_quality_scores
        in: query
        description: Return product model quality scores in the response.
        required: false
        schema:
          type: boolean
        example: true
      - in: query
        name: with_readiness
        x-visibility: public
        description: 'Return readiness information in the response.

          - `scores_only`: include readiness percentage scores only.

          - `detailed`: include readiness percentage scores together with the list of unmet requirements.

          When omitted, no readiness information is returned.


          Readiness is currently in beta and is available by request only. If you would like to participate, please reach out to your Customer Success Manager.

          '
        required: false
        schema:
          type: string
          enum:
          - scores_only
          - detailed
        example: scores_only
      - in: query
        name: with_product_uuids_associations
        description: 'When set to `true`, the products in `associations` are returned as UUIDs instead of identifiers,

          aligned with the format of the `/api/rest/v1/products-uuid` endpoint.

          When set to `false` (default), they are returned as identifiers.

          Note that a product carrying no identifier value can only be expressed as a UUID, so it is absent

          from the response unless this parameter is set to `true`.

          '
        required: false
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: 'Return product models paginated.

            The response is paginated and includes links to navigate through the pages.

            '
          content:
            application/json:
              schema:
                title: Product Models
                type: object
                allOf:
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        self:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the current page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=2&limit=5
                        first:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the first page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        previous:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the previous page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=1&limit=5
                        next:
                          type: object
                          properties:
                            href:
                              type: string
                              description: URI of the next page of resources
                              example: https://demo.akeneo.com/api/rest/v1/categories?page=3&limit=5
                - type: object
                  properties:
                    current_page:
                      type: integer
                      description: Current page number
                      example: 1
                    items_count:
                      type: integer
                      description: Total number of items (only if `with_count` parameter is set to true)
                      example: 5
                    _embedded:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          description: URI of the resource
                                          example: https://demo.akeneo.com/api/rest/v1/product-models/amarisshoe
                            - type: object
                              properties:
                                code:
                                  type: string
                                  description: Product model code
                                  x-immutable: true
                                  example: amarisshoe
                                family:
                                  type:
                                  - string
                                  - 'null'
                                  description: '[Family](https://api.akeneo.com/api-reference.html#Family) code from which the product inherits its attributes and attributes requirements.

                                    In the case of variant product, the given family should be the same as the product model family.

                                    '
                                  default: null only in the case of a non variant product
                                  x-validation-rules: It is equal to an existing family code
                                  example: smartphone
                                family_variant:
                                  type: string
                                  description: Family variant code from which the product model inherits its attributes and variant attributes
                                  x-immutable: true
                                  x-validation-rules: It is equal to an existing family variant code that belong to the family given in the `family` field
                                  example: shoes_Variant
                                parent:
                                  type:
                                  - string
                                  - 'null'
                                  description: Code of the parent [product model](https://api.akeneo.com/api-reference.html#Productmodel) when the product is a variant
                                  default: null
                                  x-validation-rules: '- It is equal to an existing product model.

                                    - This product model has the same family variant as the one given in the `family_variant field`.

                                    '
                                  example: my_super_battery
                                categories:
                                  type: array
                                  description: Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) in which the product is classified
                                  items:
                                    type: string
                                  default: []
                                  x-validation-rules: Each string of the array is equal to an existing category code
                                  example:
                                  - smartphones
                                  - electronics
                                values:
                                  type: object
                                  description: 'Product attributes values.

                                    Each key is an attribute code, and the value is an array of value objects for that attribute.

                                    See [documentation](https://api.akeneo.com/concepts/products.html#focus-on-the-product-values) for details.

                                    '
                                  patternProperties:
                                    ^\w+$:
                                      type: array
                                      items:
                                        type: object
                                        required:
                                        - data
                                        description: 'A value for a given attribute, for a given locale/scope combination.

                                          - locale: Locale code, or null if not localizable.

                                          - scope: Channel code, or null if not scopable.

                                          - data: The value for this attribute/locale/scope. Type and format depend on the attribute type (see Akeneo docs).

                                          - linked_data: Additional data for select/multiselect/asset attributes. Read-only.

                                          - attribute_type: The type of the value''s attribute. Read-only.

                                          - reference_data_name: Reference entity code or asset family code. Read-only.

                                          '
                                        properties:
                                          locale:
                                            type:
                                            - string
                                            - 'null'
                                            description: '[Locale](https://api.akeneo.com/api-reference.html#Locale) code of the product value'
                                            example: en_US
                                          scope:
                                            type:
                                            - string
                                            - 'null'
                                            description: '[Channel](https://api.akeneo.com/api-reference.html#Channel) code of the product value'
                                            example: ecommerce
                                          data:
                                            description: 'The value for this attribute/locale/scope. Type and format depend on the attribute type.

                                              - String for text, textarea, file, image, date, simple select, reference data simple select, reference entity.

                                              - Array of strings for multi select, reference data multi select, reference entity collection, asset collection, PAM asset collection.

                                              - Integer or string for number (depending on decimals_allowed).

                                              - Boolean for boolean attributes.

                                              - Object for metric, containing an "amount" (int), "unit" (string), and "symbol" (string, read-only) key.

                                              - Object for product link, containing a "type" (string) and "id" (string) key.

                                              - Object for table, containing different keys (int, boolean or string).

                                              - Object for price, with a "amount" (int) and a "currency" (string) key.

                                              '
                                            anyOf:
                                            - type: string
                                              description: 'A reference entity value.

                                                The string is the code of the reference entity.

                                                '
                                              example: designer_ref
                                            - type: array
                                              description: 'A reference entity collection value.

                                                The array contains codes of reference entities.

                                                '
                                              items:
                                                type: string
                                              example:
                                              - designer_ref_1
                                              - designer_ref_2
                                            - type: array
                                              description: 'An asset collection value.

                                                The array contains asset codes

                                                '
                                              items:
                                                type: string
                                              example:
                                              - left_side
                                              - right_side
                                            - type: boolean
                                              description: 'A boolean value.

                                                Used for attributes of type `pim_catalog_boolean`.

                                                '
                                              example: true
                                            - type: string
                                              description: "A date value for attributes of type `pim_catalog_date`.\n\nTwo input formats are accepted:\n  - **Date only** (`YYYY-MM-DD`), for example `2021-04-29`.\n  - **ISO 8601 date-time**, either with a UTC offset (`YYYY-MM-DDTHH:MM:SS+00:00`) or in Zulu form (`YYYY-MM-DDTHH:MM:SSZ`), for example `2021-04-29T08:58:00Z`.\n\nThe ISO 8601 date-time form is only meaningful on attributes where `display_time` is enabled.\nOn attributes where `display_time` is `false`, the time component is ignored and the filter behaves as if a date-only value was provided.\n\nSpace-separated date-times (for example `2021-04-29 08:58:00`) are not supported and will be rejected.\n"
                                              example: '2021-04-29T08:58:00Z'
                                            - type: string
                                              description: 'A file value.

                                                The string is a file key referencing the uploaded file.

                                                '
                                              example: f/2/e/6/f2e6674e0766acdc70f814_myFile.pdf
                                            - type: string
                                              description: 'An identifier value.

                                                Used for attributes of type `pim_catalog_identifier`.

                                                '
                                              example: SKU-12345
                                            - type: string
                                              description: 'An image value.

                                                The string is a file key referencing the uploaded image.

                                                '
                                              example: 1/d/7/f/1d7f0987000cea4d14908fe679af4e36ea3632ef_10806799_1356.jpg
                                            - type: object
                                              description: 'A metric value.

                                                Object with amount, unit, and symbol.

                                                '
                                              properties:
                                                amount:
                                                  description: 'The amount of the metric.

                                                    - String representing a number if allowed on attribute settings ("decimals_allowed" parameter).

                                                    - Integer if the attribute does not allow decimals.

                                                    '
                                                  oneOf:
                                                  - type: string
                                                    example: '800.0000'
                                                  - type: integer
                                                    example: 800
                                                unit:
                                                  type: string
                                                  description: The unit of the metric
                                                  example: GRAM
                                                symbol:
                                                  type: string
                                                  description: The symbol of the unit, resolved from the measurement family definition. Read-only.
                                                  readOnly: true
                                                  example: g
                                              required:
                                              - amount
                                              - unit
                                              example:
                                                amount: '800.0000'
                                                unit: GRAM
                                                symbol: g
                                            - type: array
                                              description: 'A multi select value.

                                                The array contains option codes.

                                                '
                                              items:
                                                type: string
                                              example:
                                              - summer_2017
                                              - winter_2016
                                            - anyOf:
                                              - type: number
                                              - type: string
                                                pattern: ^\\d+(\\.\\d+)?$
                                              description: 'A number value.

                                                Used for attributes of type `pim_catalog_number`.

                                                Can be integer or decimal, depending on attribute settings (`decimals_allowed` parameter).

                                                '
                                              example: 42.5
                                            - type: array
                                              description: 'A price collection value.

                                                The array contains objects with amount and currency.

                                                '
                                              items:
                                                type: object
                                                required:
                                                - amount
                                                - currency
                                                properties:
                                                  amount:
                                                    description: 'The amount of the price.

                                                      - String representing a number if the attribute allows decimals.

                                                      - Integer if the attribute does not allow decimals.

                                                      '
                                                    oneOf:
                                                    - type: string
                                                      example: '12.50'
                                                    - type: integer
                                                      example: 10
                                                  currency:
                                                    type: string
                                                    description: The currency code
                                                    example: USD
                                              example:
                                              - amount: '12.50'
                                                currency: USD
                                              - amount: 10
                                                currency: EUR
                                            - type: object
                                              oneOf:
                                              - type: object
                                                description: Link to a product by UUID or identifier
                                                required:
                                                - type
                                                - id
                                                properties:
                                                  type:
                                                    type: string
                                                    enum:
                                                    - product
                                                    description: The type of the linked entity
                                                    example: product
                                                  id:
                                                    type: string
                                                    description: The UUID of the linked product
                                                    example: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                                additionalProperties: false
                                              - type: object
                                                description: Link to a product by identifier
                                                required:
                                                - type
                                                - identifier
                                                properties:
                                                  type:
                                                    type: string
                                                    enum:
                                                    - product
                                                    description: The type of the linked entity
                                                    example: product
                                                  identifier:
                                                    type:
                                                    - string
                                                    - 'null'
                                                    description: The identifier of the linked product
                                                    example: bl1850b
                                                additionalProperties: false
                                              - type: object
                                                description: Link to a product model by code
                                                required:
                                                - type
                                                - id
                                                properties:
                                                  type:
                                                    type: string
                                                    enum:
                                                    - product_model
                                                    description: The type of the linked entity
                                                    example: product_model
                                                  id:
                                                    type: string
                                                    description: The code of the linked product model
                                                    example: my_super_battery
                                                additionalProperties: false
                                              description: "A product link value. Object with:\n  - type: 'product' or 'product_model'\n  - id: UUID (for product) or code (for product_model)\n  - identifier: identifier (for product)\nOnly one of id or identifier is present, depending on the type and linking method.\n"
                                              example:
                                                type: product
                                                id: fc24e6c3-933c-4a93-8a81-e5c703d134d5
                                            - type: string
                                              description: 'A simple select value.

                                                The string is the option code.

                                                '
                                              example: black
                                            - type: array
                                              description: "A table value. Each item in the array is a row, represented as an object.\nEach key in the row object is a column code, and the value depends on the column type:\n  - string (for text, select, reference entity, date)\n  - integer or number (for number, depending on decimals_allowed)\n  - boolean (for yes/no)\n  - object (for product link, measurement, etc.)\nThe first column is always a select, reference entity, incremental number, or product link.\nThe table structure (columns and types) is defined in the attribute configuration.\n"
                                              items:
                                                type: object
                                                description: 'The value for the column identified by the key.

                                                  The type of the value depends on the column type defined in the attribute configuration.

                                                  '
                                                patternProperties:
                                                  ^\w+$:
                                                    oneOf:
                                                    - type: string
                                                      description: Text, select, reference entity, or date value
                                                      example: value1
                                                    - type: number
                                                      description: Decimal value (number column, with or without decimals)
                                                      example: 3.14
                                                    - type: boolean
                                                      description: Boolean value (yes/no column)
                                                      example: true
                                                    - type: object
