    patch:
      operationId: patch_product_model_by_code
      x-visibility: public
      summary: Update/create a product model
      description: 'This endpoint allows you to update a given product model.

        Learn more about Update behavior.

        Note that if no product model exists for the given code, it creates it.

        Permissions based on your user groups are applied to the product model you try to update.

        It may result in the creation of a draft if you only have edit rights through the product model''s categories.'
      tags:
      - Product model
      security:
      - bearerToken: []
      parameters:
      - in: path
        name: code
        description: 'This path parameter is used to specify the unique identifier of the entity you want to retrieve or manipulate.

          It is essential for identifying the specific entity in the API requests.

          Ensure that the code is correctly formatted and corresponds to an existing entity in the system.

          '
        required: true
        schema:
          type: string
        example: my_entity_code
      - in: query
        name: create_missing_options
        description: 'When present in the query string (regardless of value), automatically creates missing attribute options during product/product model creation or update.

          This only works for simple select and multi select attributes that have the `enable_option_creation_during_import` property set to `true` (configurable via the Attribute API).

          '
        required: false
        schema:
          type: string
        example: ''
      requestBody:
        description: The product model to update
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: "Product model code. Required for POST (create) operations. \nOptional for PATCH (update) operations as it can be inferred from the URL.\n"
                  example: amarisshoe
                family:
                  type: string
                  description: '[Family](https://api.akeneo.com/api-reference.html#Family) code from which the product model inherits its attributes and attributes requirements.

                    In the case of variant product, the given family should be the same as the product model family.

                    '
                  x-validation-rules: It is equal to an existing family code
                  example: shoes
                family_variant:
                  type: string
                  description: 'Family variant code from which the product model inherits its attributes and variant attributes.

                    Required for root product models (without parent).

                    Optional for sub-product models (with parent), as it can be inferred from the parent.

                    '
                  x-validation-rules: It is equal to an existing family variant code that belong to the family given in the `family` field
                  example: shoes_Variant
                parent:
                  type:
                  - string
                  - 'null'
                  description: Code of the parent [product model](https://api.akeneo.com/api-reference.html#Productmodel)
                  default: null
                  x-validation-rules: '- It is equal to an existing product model.

                    - This product model has the same family variant as the one given in the `family_variant field`.

                    '
                  example: clothes
                categories:
                  type: array
                  description: Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) in which the product model is categorized
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code
                  example:
                  - clothing
                  - shoes
                add_categories:
                  type: array
                  description: 'Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) to add to the product model.

                    Existing categories will be preserved.

                    '
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code. Cannot be used with the `categories` key
                  example:
                  - clothing
                  - shoes
                remove_categories:
                  type: array
                  description: 'Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) to remove from the product model.

                    Other categories will be preserved.

                    '
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code. Cannot be used with the `categories` key
                  example:
                  - shirts
                  - trousers
                values:
                  type: object
                  description: 'Product model attributes values.

                    Each key is an attribute code, and the value is an array of value objects for that attribute.

                    See [documentation](https://api.akeneo.com/concepts/products.html#focus-on-the-product-values) for details.

                    '
                  x-validation-rules: Validation rules detailed in Product values section
                  example:
                    name:
                    - locale: en_US
                      data: Biker jacket
                    description:
                    - locale: en_US
                      scope: ecommerce
                      data: Biker jacket for women
                associations:
                  type: object
                  description: Several associations related to groups, product models and/or other products, grouped by association types
                  patternProperties:
                    ^\w+$:
                      type: object
                      properties:
                        groups:
                          type: array
                          description: Array of groups codes with which the product is in relation
                          items:
                            type: string
                        products:
                          type: array
                          description: Array of product identifiers with which the product is in relation
                          items:
                            type: string
                        product_models:
                          type: array
                          description: Array of product model codes with which the product is in relation
                          items:
                            type: string
                  additionalProperties: false
                  x-validation-rules: '- The `associationTypeCode` is the code of an existing association type.

                    - Each string in the array of the property `groups` is the code of an existing group.

                    - Each string in the array of the property `products` is the identifier of an existing product.

                    - Each string in the array of the property `product_models` is the code of an existing product model.

                    '
                  example:
                    X_SELL:
                      groups: []
                      products:
                      - product_1
                      - product_2
                      product_models:
                      - product_model_1
                    UPSELL:
                      groups:
                      - group_1
                      products: []
                      product_models: []
                quantified_associations:
                  type: object
                  description: Several quantified associations related to products and/or product models, grouped by quantified association types
                  patternProperties:
                    ^\w+$:
                      type: object
                      properties:
                        products:
                          type: array
                          description: Array of objects containing product identifiers and quantities with which the product is in relation
                          items:
                            type: object
                            properties:
                              identifier:
                                type: string
                              quantity:
                                type: integer
                        product_models:
                          type: array
                          description: Array of objects containing product model codes and quantities with which the product is in relation
                          items:
                            type: object
                            properties:
                              identifier:
                                type: string
                              quantity:
                                type: integer
                  x-validation-rules: '- The `quantifiedAssociationTypeCode` is the code of an existing association type which provides quantity information.

                    - Each object in the array of the property `products` contains the identifier of an existing product and the quantity of it.

                    - Each object in the array of the property `product_models` contains the code of an existing product model and the quantity of it.

                    '
                  example:
                    PACK:
                      products:
                      - identifier: product_1
                        quantity: 2
                      - identifier: product_2
                        quantity: 3
                      product_models:
                      - identifier: product_model_1
                        quantity: 1
                created:
                  type: string
                  description: Date of creation
                  format: dateTime
                  readOnly: true
                  example: '2025-01-01T12:00:00Z'
                updated:
                  type: string
                  description: Date of the last update
                  format: dateTime
                  readOnly: true
                  example: '2025-01-01T12:00:00Z'
                metadata:
                  type: object
                  description: More information around the product model
                  readOnly: true
                  properties:
                    workflow_status:
                      description: Status of the product model regarding the user permissions
                      type: string
                      enum:
                      - read_only
                      - draft_in_progress
                      - proposal_waiting_for_approval
                      - working_copy
                  example:
                    workflow_status: draft_in_progress
                quality_scores:
                  type: array
                  items:
                    type: object
                    properties:
                      scope:
                        type: string
                        description: Channel code for which the quality score is calculated
                      locale:
                        type: string
                        description: Locale code for which the quality score is calculated
                      data:
                        type: string
                        enum:
                        - A
                        - B
                        - C
                        - D
                        - E
                        description: Quality score value for the given channel/locale combination
                  description: 'Product quality scores for each channel/locale combination

                    (only available when the `with_quality_scores` query parameter is set to `true`).

                    '
                  readOnly: true
                  x-immutable: true
                  example:
                  - scope: ecommerce
                    locale: en_US
                    data: A
                workflow_execution_statuses:
                  type: array
                  description: 'Workflow execution statuses of the product

                    (only available when the `with_workflow_execution_statuses` query parameter is set to `true`).

                    '
                  items:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: Workflow execution UUID
                      status:
                        type: string
                        description: Status of the workflow execution
                        enum:
                        - in_progress
                        - completed
                      started_at:
                        type: string
                        format: date-time
                        description: Date and time when the workflow execution was started
                      completed_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Date and time when the workflow execution was completed, null if still in progress
                      workflow:
                        type: object
                        description: Workflow associated with the workflow execution
                        properties:
                          uuid:
                            type: string
                            description: Workflow UUID
                          code:
                            type: string
                            description: Workflow code
                          labels:
                            type: object
                            description: Workflow labels for each locale
                            additionalProperties:
                              type: string
                      tasks:
                        type: array
                        description: Tasks associated with the workflow execution
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              description: Task UUID
                            status:
                              type: string
                              description: Status of the task
                              enum:
                              - in_progress
                            created_at:
                              type: string
                              format: date-time
                              description: Date and time when the task was created
                            step:
