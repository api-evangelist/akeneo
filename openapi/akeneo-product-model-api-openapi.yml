                quality_scores:
                  type: array
                  items:
                    type: object
                    properties:
                      scope:
                        type: string
                        description: Channel code for which the quality score is calculated
                      locale:
                        type: string
                        description: Locale code for which the quality score is calculated
                      data:
                        type: string
                        enum:
                        - A
                        - B
                        - C
                        - D
                        - E
                        description: Quality score value for the given channel/locale combination
                  description: 'Product quality scores for each channel/locale combination

                    (only available when the `with_quality_scores` query parameter is set to `true`).

