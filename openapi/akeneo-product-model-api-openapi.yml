                  description: 'Codes of the [categories](https://api.akeneo.com/api-reference.html#Category) to remove from the product model.

                    Other categories will be preserved.

                    '
                  items:
                    type: string
                  default: []
                  x-validation-rules: Each string of the array is equal to an existing category code. Cannot be used with the `categories` key
                  example:
