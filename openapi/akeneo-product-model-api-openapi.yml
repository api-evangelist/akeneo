    patch:
      operationId: patch_product_models
      x-visibility: public
      summary: Update/create several product models
      description: 'This endpoint allows you to update and/or create several product models at once.

        Learn more about Update behavior.

        Note that if no product models exists for the given code, it creates it.

        Permissions based on your user groups are applied to the product models you try to update.

